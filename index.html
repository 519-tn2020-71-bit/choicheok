<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>피리 소리, 바다 건너</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&family=Song+Myung&display=swap">
<style>
:root{
  color-scheme:dark;
  --ink:#1b1a17; --ink2:#3a2f22; --paper:#f1ead8; --paper2:#e5dac0; --line:#b9a987;
  --text:#2a241c; --muted:#6b5f4c; --seal:#b3362b; --indigo:#2b4a6f; --gold:#c9a24f;
  --display:"Song Myung","Nanum Myeongjo","Batang",serif;
  --body:"Gowun Batang","Nanum Myeongjo","Batang",serif;
  --ui:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:var(--ink);color:var(--text)}
body{font-family:var(--body);-webkit-user-select:none;user-select:none;touch-action:manipulation}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#cv{position:fixed;left:0;top:0;image-rendering:pixelated;image-rendering:crisp-edges}

/* HUD */
.hud{position:fixed;left:0;right:0;top:0;display:flex;gap:8px;align-items:flex-start;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 0;pointer-events:none;z-index:5}
.quest{pointer-events:auto;background:rgba(241,234,216,.94);border:2px solid var(--ink2);box-shadow:0 3px 0 rgba(0,0,0,.35);padding:7px 12px;max-width:min(520px,62vw);font-family:var(--ui);font-size:13px;line-height:1.45}
.quest .ch{font-family:var(--display);font-size:16px;color:var(--seal);display:block}
.quest .obj::before{content:"▸ ";color:var(--indigo)}
.hbtns{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;pointer-events:auto}
.hb{background:rgba(241,234,216,.94);border:2px solid var(--ink2);box-shadow:0 3px 0 rgba(0,0,0,.35);padding:6px 10px;font-family:var(--ui);font-size:13px;white-space:nowrap}
.hb:hover{background:var(--paper)}
.hb .n{color:var(--seal);font-variant-numeric:tabular-nums;margin-left:3px}
.money{font-family:var(--ui);font-size:13px;background:rgba(241,234,216,.94);border:2px solid var(--ink2);padding:6px 10px;color:#7a5a12;font-variant-numeric:tabular-nums}

/* 대화 */
.dlg{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));width:min(780px,calc(100% - 24px));background:var(--paper);border:3px solid var(--ink2);box-shadow:0 0 0 2px var(--paper) inset,0 0 0 3px var(--line) inset,0 5px 0 rgba(0,0,0,.4);padding:16px 20px 14px;z-index:20;cursor:pointer}
.dlg .nm{display:flex;align-items:center;gap:10px;margin-bottom:6px;min-height:26px}
.dlg .nm b{font-family:var(--display);font-weight:400;font-size:20px}
.dlg .nm .think{font-family:var(--ui);font-size:12px;color:var(--muted)}
.dlg .orig{margin-left:auto;display:inline-grid;place-items:center;width:30px;height:30px;border:2px solid var(--seal);color:var(--seal);font-family:var(--display);font-size:15px;transform:rotate(-6deg);flex:none}
.dlg .tx{font-size:17.5px;line-height:1.85;min-height:3.7em;white-space:pre-wrap}
.dlg .tx.narr{color:#3d3428}
.dlg .more{position:absolute;right:16px;bottom:8px;font-size:12px;color:var(--muted);font-family:var(--ui);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.chs{display:grid;gap:6px;margin-top:10px}
.chs button{text-align:left;background:var(--paper2);border:2px solid var(--line);padding:8px 12px;font-size:16px;line-height:1.5}
.chs button.sel,.chs button:hover{border-color:var(--indigo);background:#e9e4d3}
.chs button .k{font-family:var(--ui);font-size:12px;color:var(--muted);margin-right:8px}

.dlg.hasp .nm{margin-left:150px}
.dlg .port{position:absolute;left:14px;bottom:calc(100% - 44px);width:136px;height:136px;object-fit:cover;border:3px solid var(--ink2);background:var(--paper2);box-shadow:0 4px 0 rgba(0,0,0,.35)}
.cimg{display:block;width:calc(100% + 52px);max-width:none;margin:-24px -26px 16px;aspect-ratio:16/9;object-fit:cover;border-bottom:3px solid var(--ink2)}
@media (max-width:560px){.dlg .port{width:84px;height:84px;left:10px;bottom:calc(100% - 26px)}.dlg.hasp .nm{margin-left:92px}.cimg{width:calc(100% + 36px);margin:-18px -18px 12px}}
.dlg.story{background:#efe6d0}
.dlg.story .tx{color:#4a3d2c;font-style:normal}
.routes{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:10px;text-align:left}
.route{display:grid;grid-template-columns:84px 1fr;gap:4px 12px;align-items:start;background:rgba(241,234,216,.95);border:3px solid var(--ink2);padding:12px;box-shadow:0 5px 0 rgba(0,0,0,.4);color:var(--text)}
.route:hover,.route:focus-visible{border-color:var(--seal);transform:translateY(-2px)}
.route img{grid-row:span 2;width:84px;height:84px;object-fit:cover;border:2px solid var(--ink2)}
.route b{font-family:var(--display);font-weight:400;font-size:22px}
.route span{font-family:var(--ui);font-size:13px;line-height:1.6;color:var(--muted)}
.bt .pc img{width:96px;height:96px;object-fit:cover;border:2px solid var(--ink2);display:block;background:#d9cfb4}
.gl{margin-top:8px;padding:8px 10px;background:#e9e2cf;border-left:3px solid var(--indigo);font-family:var(--ui);font-size:14px;line-height:1.7;color:#3a3226;white-space:normal}
.gl b{font-family:var(--display);font-weight:400;color:var(--indigo);margin-right:8px;font-size:14px}
.dlg .gl{max-height:7.5em;overflow:auto}
.rec.tipr{border-left-color:var(--indigo);font-family:var(--ui);font-size:14px}
.hb.ping{animation:ping .8s ease-out}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(43,74,111,.8)}100%{box-shadow:0 0 0 12px rgba(43,74,111,0)}}
.mg .seq{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:12px 0}
.mg .arr{width:40px;height:40px;display:grid;place-items:center;border:2px solid var(--line);background:var(--paper2);font-size:22px;font-family:var(--ui)}
.mg .arr.ok{background:#dfe6ef;border-color:var(--indigo);color:var(--indigo)}
.mg .arr.cur{border-color:var(--seal);background:#fff3d6;transform:scale(1.12)}
.mg .cloth{position:relative;height:56px;background:repeating-linear-gradient(45deg,#f5ecd8 0 8px,#efe3c8 8px 16px);border:2px solid var(--ink2);margin-top:10px}
.mg .seam{position:absolute;left:4%;right:4%;top:50%;border-top:2px dashed #b9a987}
.mg .thread{position:absolute;left:4%;top:calc(50% - 2px);height:4px;background:repeating-linear-gradient(90deg,var(--seal) 0 10px,transparent 10px 16px);max-width:92%;transition:width .15s}
.mg .pad4{display:grid;grid-template-columns:repeat(4,56px);gap:8px;justify-content:center;margin-top:10px}
.mg .pad4 button,.mg .pad2 button{height:52px;font-size:22px;font-family:var(--ui);background:var(--paper2);border:2px solid var(--ink2);box-shadow:0 3px 0 rgba(0,0,0,.25)}
.mg .pad2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.mg .pad2 button{font-size:16px}
.mg .gauge{height:14px;border:2px solid var(--ink2);background:var(--paper2);margin-top:10px}
.mg .gauge i{display:block;height:100%;width:0;background:var(--indigo);transition:width .1s}
.mg .wellbox{position:relative;height:150px;margin:10px auto 0;width:140px;background:linear-gradient(#8f8a7e,#6f6a60);border:3px solid var(--ink2);border-radius:6px}
.mg .rope{position:absolute;left:50%;top:0;width:2px;background:#cbb178;height:84%}
.mg .bucket{position:absolute;left:50%;transform:translateX(-50%);bottom:8%;font-size:30px}
.mg .pot{position:relative;width:150px;height:150px;margin:10px auto 0;border-radius:50%;background:radial-gradient(circle,#f4efe4 0 45%,#2b2622 46% 60%,#1d1813 61%);border:3px solid var(--ink2)}
.mg .ladle{position:absolute;left:50%;top:14%;width:6px;height:36%;margin-left:-3px;background:#8e6a44;transform-origin:50% 100%;transition:transform .12s}
.mg .next{position:absolute;left:0;right:0;bottom:-26px;text-align:center;font-family:var(--ui);font-size:13px;color:var(--muted)}
.mg .words{display:flex;flex-wrap:wrap;align-items:center;gap:2px;justify-content:center;margin:14px 0;font-size:22px;font-family:var(--display)}
.mg .gap{min-width:26px;height:40px;border:0;background:transparent;color:#b9a987;font-size:20px;border-radius:6px}
.mg .gap:hover{background:#efe3c8}
.mg .gap.on{color:var(--seal);font-weight:700;background:#f7e2dc}
.mg .dishes{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.mg .dish{font-family:var(--ui);font-size:14px;background:var(--paper2);border:2px solid var(--line);padding:6px 10px}
.mg .dish.sel{border-color:var(--seal);background:#fff3d6}
.mg .table{display:grid;grid-template-columns:1fr 1fr 1fr 70px;grid-template-rows:64px 64px;gap:8px;padding:12px;background:#8e5a34;border:3px solid #5a3b22;border-radius:8px}
.mg .slot{background:#a8744a;border:2px dashed #e8d2a8;color:#fff4de;font-family:var(--ui);font-size:13px;display:grid;place-items:center;line-height:1.2}
.mg .slot b{font-weight:500;display:block}
.mg .slot i{font-style:normal;opacity:.75}
.mg .s-b1{grid-column:1;grid-row:1}.mg .s-b2{grid-column:2;grid-row:1}.mg .s-b3{grid-column:3;grid-row:1}.mg .s-f1{grid-column:1;grid-row:2}.mg .s-f2{grid-column:2/4;grid-row:2}.mg .s-s{grid-column:4;grid-row:1/3}
.mg .mgmsg{min-height:1.6em;margin-top:8px}
.lnk{background:none;border:0;color:#e3c27a;text-decoration:underline;font-family:var(--ui);font-size:12px;margin-top:6px;cursor:pointer}
.tq{display:block;font-style:normal;font-size:12.5px;opacity:.8;margin-bottom:3px;border-left:2px solid currentColor;padding-left:7px}
.mg .cloth2{position:relative;height:96px;margin-top:10px;background:var(--cl);border:2px solid var(--ink2);border-radius:4px;overflow:hidden;box-shadow:inset 0 -6px 0 rgba(0,0,0,.08)}
.mg .cloth2 .weave{position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.14) 0 2px,transparent 2px 5px),repeating-linear-gradient(90deg,rgba(0,0,0,.06) 0 2px,transparent 2px 5px)}
.mg .cloth2 .seam2{position:absolute;left:5%;right:5%;top:58%;border-top:2px dashed rgba(60,40,20,.35)}
.mg .cloth2 .st{position:absolute;top:calc(58% - 3px);height:5px;background:#b23a2a;border-radius:3px;box-shadow:0 1px 0 rgba(0,0,0,.35);animation:stIn .18s ease-out}
.mg .cloth2 .st.out{animation:stOut .25s forwards}
@keyframes stIn{from{transform:scaleX(0);transform-origin:left}to{transform:scaleX(1)}}
@keyframes stOut{to{opacity:0;transform:translateY(10px) rotate(20deg)}}
.mg .cloth2 .thr{position:absolute;top:calc(58% - 1px);height:3px;background:#b23a2a;opacity:.8;transition:left .15s,width .15s}
.mg .cloth2 .needle{position:absolute;top:calc(58% - 62px);width:9px;height:76px;margin-left:-4px;filter:drop-shadow(0 0 1px #222) drop-shadow(2px 3px 0 rgba(0,0,0,.25));transform:rotate(-28deg);transform-origin:50% 90%;transition:left .15s}
.mg .cloth2 .needle::before{content:"";position:absolute;left:1px;top:0;width:7px;height:100%;background:linear-gradient(90deg,#8d949c,#eef1f4 45%,#7d848c);border-radius:2px 2px 50% 50%/2px 2px 100% 100%}
.mg .cloth2 .needle i{position:absolute;left:3px;top:6px;width:3px;height:10px;background:var(--cl);border-radius:1px}
.mg .cloth2 .needle.dip{animation:dip .24s ease-in-out}
@keyframes dip{0%{transform:rotate(-28deg) translateY(0)}45%{transform:rotate(-8deg) translateY(22px)}100%{transform:rotate(-28deg) translateY(0)}}
.mg .cloth2 .needle.done{animation:lift .6s forwards}
@keyframes lift{to{transform:rotate(-60deg) translate(-10px,-30px);opacity:0}}
.mg .cloth2.tangle{animation:tangle .3s}
@keyframes tangle{25%{transform:translateX(-5px) rotate(-.6deg)}75%{transform:translateX(5px) rotate(.6deg)}}
.mg .cloth2.finish{box-shadow:0 0 0 4px #e3c27a,inset 0 -6px 0 rgba(0,0,0,.08);transition:box-shadow .3s}
.mg .cloth2 .spark{position:absolute;top:calc(58% - 14px);width:28px;height:28px;margin-left:-14px;border-radius:50%;pointer-events:none;opacity:0}
.mg .cloth2 .spark.on{animation:spark .35s ease-out}
@keyframes spark{0%{opacity:.9;box-shadow:0 0 0 0 rgba(255,236,170,.9)}100%{opacity:0;box-shadow:0 0 0 14px rgba(255,236,170,0)}}
.mg .sewbar{display:flex;justify-content:space-between;font-family:var(--ui);font-size:13px;margin-top:6px;min-height:1.4em}
.mg .sewbar .combo{color:var(--seal);font-weight:700}
.mg .sugi{position:relative;background:#f7f0dc;border:2px solid var(--ink2);padding:14px 16px 18px;margin-top:8px;font-family:var(--display);font-size:17px;line-height:1.9}
.mg .sugi .orig{position:absolute;right:8px;top:6px}
.mg .sugi p{margin:0}
.mg .sugsign{display:inline-block;margin-top:8px;color:var(--seal);font-family:var(--ui);font-size:14px;animation:stIn .3s}
.mg .sugsign i{font-style:normal;font-family:var(--display);font-size:22px;border:2px solid var(--seal);padding:0 6px;margin-left:6px}
.mg .picks{display:grid;gap:6px;margin-top:8px}
.mg .picks.grid{grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}
.mg .picks button{font-family:var(--ui);font-size:14px;text-align:left;background:var(--paper2);border:2px solid var(--line);padding:8px 10px;cursor:pointer}
.mg .picks button.on{border-color:var(--indigo);background:#dfe6ef}
.mg .picks button:hover{border-color:var(--indigo)}
.mg .resp{margin-top:10px;font-family:var(--ui);font-size:14px;color:var(--seal)}
.mg .brushwrap{display:flex;justify-content:center;margin-top:10px}
.mg .brush{display:grid;justify-items:center;gap:4px;background:var(--paper2);border:2px solid var(--ink2);padding:8px 18px;cursor:pointer;touch-action:none;user-select:none;font-family:var(--ui);font-size:13px}
.mg .brush svg{width:160px;height:70px}
.mg .brush .stroke{fill:none;stroke:#1d1813;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
.mg .route{display:flex;flex-wrap:wrap;gap:4px 0;align-items:center;margin:12px 0}
.mg .route .stop{display:flex;align-items:center;font-family:var(--ui);font-size:13px}
.mg .route .stop i{display:inline-block;width:18px;height:3px;background:var(--line)}
.mg .route .stop:first-child i{display:none}
.mg .route .stop b{font-weight:500;border:2px solid var(--line);background:var(--paper2);padding:3px 7px;min-width:34px;text-align:center}
.mg .route .stop.on i{background:var(--indigo)}
.mg .route .stop.on b{border-color:var(--indigo);background:#dfe6ef;color:var(--indigo)}
.mg .route .stop.cur b{border-color:var(--seal);border-style:dashed}
#mini{position:fixed;right:12px;top:calc(58px + env(safe-area-inset-top,0px));z-index:4;border:2px solid var(--ink2);box-shadow:0 3px 0 rgba(0,0,0,.35);background:#1b1a17;image-rendering:pixelated;display:none;pointer-events:none}
@media (max-width:560px){#mini{top:auto;bottom:calc(120px + env(safe-area-inset-bottom,0px));right:10px;transform:scale(.8);transform-origin:right bottom}}
body.talking #mini{opacity:.35}
.mg .psg{position:relative;background:#f7f0dc;border:2px solid var(--ink2);padding:10px 40px 10px 12px;margin:8px 0;font-family:var(--display);font-size:16.5px;line-height:1.9;max-height:12em;overflow:auto}
.mg .psg .orig,.mg .sugi .orig{position:absolute;right:8px;top:6px;display:inline-grid;place-items:center;width:26px;height:26px;border:2px solid var(--seal);color:var(--seal);font-family:var(--display);font-size:13px;transform:rotate(-6deg)}
.mg .psg .hit{background:#dfe6ef;color:var(--indigo);font-weight:700;border-radius:3px;padding:0 2px}
.histlnk{margin-left:auto;font-family:var(--ui);font-size:12px;background:transparent;border:1.5px solid var(--line);padding:2px 8px;color:var(--muted)}
.histlnk:hover{border-color:var(--indigo);color:var(--indigo)}
.dlg .orig+.histlnk{margin-left:8px}
#hist{z-index:90}
#hist .rec.plain{border-left-color:var(--line);color:#4a3d2c}
#hist .seal-s{width:18px;height:18px;font-size:10px;vertical-align:middle}
.mg .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin-top:8px}
.mg .cards button{display:grid;gap:2px;text-align:left;background:#6d4b2c;color:#f1ead8;border:2px solid var(--ink2);padding:10px;min-height:70px;font-family:var(--ui);font-size:13px}
.mg .cards button b{font-family:var(--display);font-weight:400;font-size:17px}
.mg .cards button.on{background:#f7f0dc;color:var(--text);border-color:var(--gold);animation:stIn .25s}
.mg .cards button.on span{color:var(--muted)}
.mg .picks button:disabled{opacity:.6;cursor:default}
.ek{font-weight:700;color:#2a1d10;background:linear-gradient(transparent 58%,rgba(242,201,76,.6) 58%);padding:0 1px}
.eb2{font-weight:700;color:var(--seal)}
.alias{font-family:var(--ui);font-size:12.5px;color:var(--muted)}
.mg .arena{position:relative;height:90px;margin-top:10px;background:linear-gradient(#8a9a5a,#6f7f48);border:2px solid var(--ink2);overflow:hidden}
.mg .arena .zone{position:absolute;top:0;bottom:0;width:13%;background:rgba(179,54,43,.28);border-left:2px dashed var(--seal);border-right:2px dashed var(--seal)}
.mg .arena .zl{left:30%}.mg .arena .zr{right:30%}
.mg .arena .ballc{position:absolute;left:50%;top:50%;width:34px;height:34px;margin:-17px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff7cf,#f5cd4f 40%,#b3800f);box-shadow:0 0 16px 4px rgba(255,222,120,.7)}
.mg .arena .ballc.bump{animation:bump .25s}
@keyframes bump{50%{transform:scale(1.35)}}
.mg .arena .tg{position:absolute;top:22px;font-size:40px;line-height:1}
.mg .belly{position:relative;height:110px;margin-top:10px;border-radius:50px;background:radial-gradient(ellipse at center,#6b1f1a,#3a0f0c 70%);border:3px solid #1d1813;overflow:hidden}
.mg .belly .organ{position:absolute;left:50%;top:50%;width:30px;height:30px;margin:-15px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff7cf,#f5cd4f 40%,#b3800f);box-shadow:0 0 18px 6px rgba(255,222,120,.6)}
.mg .belly .gauge2{position:absolute;left:12px;right:12px;bottom:10px;height:10px;background:rgba(0,0,0,.35);border:1px solid #f1ead8}
.mg .belly .gauge2 i{display:block;height:100%;width:0;background:#f2c94c;transition:width .15s}
.mg .belly .bl{position:absolute;left:14px;bottom:22px;color:#f1ead8;font-family:var(--ui);font-size:12px}
.mg .scrolls{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:8px}
.mg .scrolls figure{margin:0;text-align:center;font-family:var(--ui);font-size:13px;color:var(--muted)}
.mg .scrolls svg{width:100%;max-width:170px}
.sheet.itemget{text-align:center;position:relative;overflow:hidden}
.itemget>*:not(.rays){position:relative}
.itemget .itimg{display:block;margin:6px auto 10px;width:min(240px,58vw);border-radius:8px;border:3px solid #8a6a1f;box-shadow:0 0 40px 8px rgba(255,210,110,.6);animation:itrise .9s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes itrise{from{transform:translateY(50px) scale(.5);opacity:0}}
.itemget .rays{position:absolute;left:50%;top:140px;width:640px;height:640px;margin:-320px 0 0 -320px;background:repeating-conic-gradient(rgba(255,215,120,.22) 0 9deg,transparent 9deg 18deg);border-radius:50%;animation:itspin 14s linear infinite;pointer-events:none}
@keyframes itspin{to{transform:rotate(360deg)}}
.thumb{float:right;width:52px;height:52px;object-fit:cover;border:2px solid var(--line);border-radius:4px;margin-left:6px}
.mg .unroll{overflow:hidden;animation:unroll 1.1s ease-out both;border:2px solid #6d4b2c}
.mg .unroll img{display:block;width:100%}
.mg .scrolls figure:nth-child(2) .unroll{animation-delay:1s}
@keyframes unroll{from{clip-path:inset(0 0 100% 0)}to{clip-path:inset(0 0 0 0)}}
.mg .backwrap{display:grid;grid-template-columns:1fr 110px;gap:10px;align-items:center;margin-top:8px}
.mg .back{width:100%;max-width:320px;background:#f7f0dc;border:2px solid var(--ink2)}

<script>
const BODY=new Set(["최척의 자는 백승이며 남원 사람이다.","어려서 어머니를 여의고 아버지 숙과 함께 남원부 서문밖에 있는 만복사의 동쪽에서 외롭게 살고 있었다.","최척은 어려서부터 뜻이 크고 기개가 있었으며, 친구와 어울려 놀기를 좋아하고, 사소한 예절에는 구애를 받지 않았다.","이에 그의 아버지가 경계하여 말했다.","네가 배우지 않으면 무뢰한이 될 터인데, 너는 장차 어떤 사람이 되려 하느냐?","하물며 지금 나라에 전쟁이 일어나 바야흐로 고을마다 무사를 징집하고 있는데, 너는 쓸데없이 활을 쏘거나 말을 타고 놀며 늙은 아비에게 근심만 끼치고 있으니 효자라고 할 수 있겠느냐?","머리를 숙이고 선비를 좇아 과거 공부를 한다면, 비록 과거에 급제하여 벼슬길에는 오르지 못할 지라도 등에 화살을 지고 군대에 종사하는 일은 면할 수 있을 것이다.","성남에 사는 정상사는 나와 죽마고우이다. 그는 힘써 배워서 학문이 두텁고도 뛰어나며 또 처음 배우는 사람을 잘 인도하여 가르치니, 너는 성남으로 가서 그를 스승으로 섬기도록 해라.","최척은 아버지의 명을 받들어 즉시 책을 옆구리에 끼고 문을 나서, 정사도에게 가르침을 받으며 부지런히 공부를 하고 책을 읽었다.","최척의 문장이 날로 발전하자, 마을 사람들은 모두 그의 총명하고 민첩함을 칭찬하였다.","최척이 정상사의 집에서 공부를 할 때마다 문득 어떤 계집아이가 창 밑에 숨어서 책 읽는 소리를 몰래 엿듣곤 하였다.","그녀의 나이는 겨우 16살 정도 되어 보였는데 머릿결은 구름을 드리운 듯 아름다웠고 얼굴은 꽃처럼 어여뻤다.","하루는 상사가 식사를 하기 위해 내당으로 들어가고 최척이 홀로 앉아서 시를 읊고 있는데, 갑자기 조그만 종이 쪽지 하나가 창 틈으로 들어왔다.","최척이 주워서 읽어보니, 곧 <표유매>의 마지막 장이 씌어 있었다.","최척은 이 글을 본 뒤부터 정신이 날아갈 듯 황홀하고, 마음을 가라앉힐 수가 없었다.","그래서 어두운 밤을 틈타 향기를 훔치리라고 거듭 마음을 먹었다가도 이내 김태현의 고사를 생각하면서 애써 자신의 감정을 억누르고, 다시는 그런 생각을 하지 말자고 스스로 다짐하곤 했다.","그러나 곰곰이 생각하고 있노라면, 마음속에서 도의와 욕구가 서로 치고 받았다.","잠시 후에 상사가 나오는 것을 보고 즉시 그 종이 쪽지를 소매 속에 감추었다.","공부를 마치고 집으로 돌아오는데, 푸른 옷을 입은 계집아이가 문밖에 서 있다가 최척의 뒤를 따라오며 말했다.","저 드릴 말씀이 있습니다.","최척은 쪽지에 적힌 시를 보고 마음이 흔들리고 있던 차에 이 말을 듣고는 기쁘면서도 이상하다는 생각이 들었다.","그래서 고개를 끄덕여 오라고 한 후 집으로 데리고 가 마음속에 품고 있던 것을 물으니, 그 아이가 대답했다.","저는 이낭자의 계집종인 춘생입니다.","낭자가 저에게 낭군의 화답시를 청해 오라고 하였습니다.","최척이 의아해서 말했다.","너는 정상사 집의 아이가 아니냐?","그런데 어째서 이낭자라고 말하느냐?","춘생이 말했다.","우리 주인댁은 본래 서울 숭례문 밖 청파리에 있었으며, 주인 어른인 경신께서는 일찍 돌아가시고 과부인 심씨가 딸 하나와 그곳에서 외롭게 살고 있었습니다.","그 처녀의 이름은 옥영인데, 시를 창 틈으로 던지고 화답시를 요청했던 분이 바로 이 분입니다.","우리는 지난 해 배를 타고 강화도로 피난을 갔다가 다시 나주 땅 회진에 와서 머물러 있었는데, 가을에 다시 회진에서 이곳으로 굴러 들어오게 되었습니다.","이 집의 주인은 우리 마님과 친척이라서 우리에게 무척 잘해 주십니다.","또 장차 낭자를 위해 혼처를 구하려고 하는데, 아직 마땅한 혼처를 구하지 못하고 있는 터입니다.","최척이 말했다.","너의 낭자는 과부의 딸로서 어떻게 한문을 알게 되었느냐?","춘생이 대답했다.","낭자에게 득영이라는 언니가 있었습니다.","그 분은 문장에 능했으나, 19세라는 젊은 나이에 시집도 못 가고 일찍 죽었습니다.","우리 낭자는 항상 언니 곁에서 입과 귀로 글을 주워 들어 거칠게나마 이름을 쓸 수 있게 된 것입니다.","최척은 춘생에게 술과 음식을 대접하고, 이어서 화려한 문체로 답서를 써 일렀다.","아침에 받은 훌륭한 글은 실로 저의 마음을 사로잡았습니다.","게다가 곧이어 청조를 만나게 되니 제 기쁨을 어떻게 다 헤아릴 수 있겠습니까?","매번 거울 속의 그림자에만 의지하고 그림 속의 참모습은 불러내기 어려웠습니다.","님을 사모하는 마음은 유혹할 수 있고 상자 속의 향기는 훔칠 수 있다는 것을 모르는 것은 아닙니다.","그러나 봉산으로 가는 길은 멀고 약수는 건너기 어려웠습니다.","어떻게 할까 이리저리 고민하고 궁리하는 사이에 이미 얼굴은 누렇게 뜨고 목덜미는 말라 비틀어졌습니다.","주저하며 잠을 이루지 못하니, 애가 끊는 듯하고 넋은 사라지는 듯했습니다.","그런데 뜻밖에도 오늘 빙간의 말과 양대의 비가 홀연히 꿈속에 들어오고 서왕모의 편지가 문득 전해져, 갑자기 성기의 만남을 이루고 월노의 끈을 맺게 되었습니다.","이로써 제 삼생의 소원이 거의 다 이루어졌으니, 동혈지맹을 번복하지 마십시오, 글로 말을 다 표현하지 못하는데, 말인들 어떻게 마음을 표현할 수 있겠습니까?","옥영은 편지를 받고 매우 기뻤다.","그래서 다음날 또 답장을 써서 춘생에게 전달케 하였는데 그 글에 일렀다.","저는 서울에서 생장하였으나 일찍 부친을 여의고, 지금껏 형제도 없이 편모를 모셔왔습니다.","몸은 비록 영락하였으나 마음은 빙호 같으며, 거칠게나마 맑고 깨끗한 행실을 알아 대문 앞에 길가마저도 나가 본 일이 없습니다.","그러나 좋은 때를 만나지 못하여 세상살이에 어려움이 많고, 전쟁이 어지럽게 일어나 온 가족이 흩어져 떠돌다가 이곳 남쪽 땅까지 이르러 친척에게 몸은 의탁하고 있습니다.","나이는 이미 시집 갈 때가 되었으나 아직 받들어 공경할 사람을 만나지 못하고, 항상 옥이 난리에 깨지거나 구슬이 강포한 무리에게 더럽혀질까 두려워하고 있습니다. 또 이 때문에 늙으신 어머님께는 근심을 끼치고, 제 스스로도 몸을 보전하기가 어려워 슬프기만 합니다.","그러나 사라가 반드시 교목에게 의지하듯이 여자의 백년고락은 실로 남자에게 달려 있으니, 진실로 교목처럼 훌륭한 남자가 아니라면 제가 어떻게 결혼할 마음을 둘 수 있겠습니까?","가까운 곳에서 낭군을 뵈오니, 말씀이 온화하고 행동거지가 단정하며, 성실하고 진솔한 빛이 얼굴에 넘쳐흐르고, 우아한 기품이 보통 사람보다 한결 빼어났습니다.","만약 제가 어진 남편을 구하고자 한다면 낭군 외에 달리 누가 있겠습니까?","저는 용렬한 사람의 아내가 되기보다는 차라리 군자의 첩이 되는 것이 낫다고 생각합니다.","그러나 제 비천한 자질을 돌이켜 보면 군자의 짝이 되지 못할까 두렵기만 합니다.","어제 제가 시를 던진 것은 실로 저의 음란함을 깨우쳐 보이기 위함이 아니라, 단지 시험삼아서 낭군의 의향을 탐지하려는 것이었습니다.","제가 비록 지식은 없으나 원래 사족으로서 애초에 저자에서 노니는 무리가 아닌데, 어떻게 담벼락에 구멍을 뚫고 몰래 만날 마음을 가질 수 있겠습니까?","반드시 부모님께 아뢰어 마침내 예에 따라 혼례를 치른다면, 비록 먼저 사사로이 시를 던져 스스로 중매하는 추태를 범했으나 정절과 신의를 지키어 거안지경을 다하고자 합니다.","이미 사사로이 편지를 주고받아 그윽하고 바른 덕을 크게 잃어버리긴 했으나 이제 간과 쓸개가 비추듯 서로의 마음을 잘 알게 되었으니, 다시는 함부로 편지를 보내지 않겠습니다.","이제부터는 반드시 중매를 두어 제가 행로했다는 비난을 받지 않도록 해주시길 간절히 바라오니, 잘 생각하시어 일을 꾀하십시오.","최척은 편지를 다 읽은 후 마음이 더욱 기뻐서 자기 아버지에게 간절하게 아뢰었다.","들으니, 과부 심씨가 서울에서 내려와 정씨 집에 더부살이를 하고 있는데, 그 딸이 결혼할 나이인데다가 용모가 매우 아름답고 성격이 온순하다고 합니다.","아버님께서 불초한 자식을 위해 시험삼아 정상사에게 구혼해 보십시오, 만약 이 일을 늦추시어 지위가 높은 사람이 우리보다 먼저 구혼하게 된다면 후회해도 소용이 없을 것이니, 우리가 먼저 구혼하는 것이 좋을 듯합니다.","아버지가 말했다.","저들은 귀족으로 멀리 타향에 와서 잠시 더부살이를 하고 있기 때문에 반드시 부유한 집에 혼처를 구하려고 할 것이다.","그러나 우리 집은 본래부터 가난하니, 저들이 우리의 구혼을 기꺼워할 리가 없다.","최척이 거듭 간청하여 말했다.","먼저 물어 보십시오.","이루어지고 이루어지지 않는 것은 하늘의 뜻입니다.","이에 최척의 아버지가 가서 물으니, 상사가 말했다.","나의 표매가 서울에서 피난을 와 궁박하게 내 집에 머물러 있는데, 그녀의 외동딸이 자색이 뛰어나고, 재주와 행실이 보통이 아니라네.","그래서 내가 바야흐로 신랑감을 구해 가정을 이루게 하려고 하네.","진실로 자네의 아들이 훌륭한 사윗감이라는 것을 알고 있지만, 단지 자네가 가난한 것이 걱정일세.","그러나 내가 마땅히 누이와 상의를 해서 다시 알려줌세.","최숙이 집으로 돌아와 이러한 말을 전하자, 최척은 초조한 모습으로 상사의 회답이 오기를 고대하였다.","상사가 심씨에게 최숙이 구혼한 사실을 이야기하니, 심씨가 거절하며 말했다.","저는 온 집안이 유리되어 의탁할 곳 없이 외롭고도 어렵사리 지내고 있습니다.","그래서 이 딸을 반드시 부유한 사람에게 시집을 보내어 의탁할 계획을 갖고 있습니다.","최랑이 비록 어질다고는 하나 그 집안이 매우 가난하다고들 하니, 저는 원하지 않습니다.","이날 밤 옥영이 어머니 곁으로 가서 말을 하려다가 머뭇거리니, 어머니가 말했다.","네가 무슨 생각을 하고 있는지 숨기지 말고 털어놓아라.","옥영이 얼굴을 붉히고 말을 못하다가 억지로 입을 열어 말했다.","어머님께서 저를 위해 사위를 고르시되 반드시 부유한 사람만을 구하려고 하시니, 그 마음이 안타깝습니다.","집안이 부유하고 사윗감마저 어질다면 얼마나 다행이겠습니까?","그러나 만약 집안은 비록 먹을 것이 풍족하더라도 사윗감이 어질지 못하다면, 그 집안을 보존하기 어려울 것입니다.","사람이 어질지 못한데 제가 그를 남편으로 섬긴다면 비록 곡식이 있다고 한들 그가 능히 우리를 먹여 살릴 수 있겠습니까?","제가 최생을 몰래 살펴보니, 그는 하루도 빠지지 않고 매일 우리 아저씨께 와서 성의를 다하여 성실하게 배웠습니다.","이로 보건대, 그는 결코 경박하거나 방탕한 사람은 아닙니다.","이 사람을 배필로 삼을 수만 있다면 저는 죽어도 여한이 없습니다.","하물며 가난한 것은 선비의 본분이요, 떳떳하지 못한 재물은 뜬구름과 같은 것입니다.","청컨대, 최생으로 마음을 정하시어 저의 소원을 이루어 주십시오.","이것은 처녀가 제 입으로 할 말은 아니지만, 제 일생과 관련된 것입니다.","그런데 어떻게 부끄러움을 꺼려하여 침묵을 지킨 채 말을 하지 않고 있다가, 마침내 용렬한 사람에게 시집가서 일생을 그르쳐 버릴 수 있겠습니까?","이미 깨어진 시루는 다시 완전하기 어려우며, 물을 들인 실은 다시 희게 할 수 없듯이 일이란 한 번 그르치면 서제막급입니다.","하물며 지금 제 처지는 다른 사람들과 달라 집에는 엄한 아버지가 계시지 않고 왜적이 가까운 곳에 있습니다, 진실로 참되고 믿음직한 사람이 아니라면 어떻게 우리 두 모녀로 하여금 우리 가문의 운명을 온전하게 보존할 수 있도록 하겠습니까?","지금은 차라리 안씨가 결혼을 요청하고 서매가 스스로 낭군을 선택한 것을 본받아야 할 때입니다.","그런데 어떻게 여자의 속마음을 숨긴 채 단지 남의 입만 바라보면서 가까운 곳에 있는 배필을 가만히 놓아두어야 하겠습니까?","옥영의 모친은 어쩔 수 없이 다음날 정공에게 아뢰어 말했다.","제가 밤에 다시 생각해 보니, 최씨가 비록 가난하지만 그의 아들이 준수하며 빈부는 하늘에 달려 있기 때문에 사람의 힘으로 이룰 수 있는 것이 아닙니다.","그래서 모르는 사람에게 구혼하기보다는 차라리 최랑을 사위로 삼는 것이 좋을 것 같습니다.","정공이 말했다.","누이가 그렇게 원한다면 내가 반드시 일이 성사되도록 권하리라.","최랑이 비록 한미한 선비이나 됨됨이가 옥처럼 훌륭하여 서울에서도 이 같은 사람은 거의 찾을 수 없을 게다.","저 사람이 만약 학업을 완수한다면 가난에서 벗어나 부자가 될 것이니, 어찌 숙맥과 같은 사람이겠는가?","정공은 바로 그 날 중매쟁이를 최숙에게 보내어 혼인을 약속하고, 오는 9월 보름에 혼례를 치르기로 결정하였다.","최척은 너무 기뻐 손가락을 꼽아 가면서 그 날이 오기를 기다렸다.","세월이 어느 정도 흐른 뒤였다.","남원부 사람으로 전에 참봉을 지냈던 변사정이 의병을 모집하여 영남으로 가려고 하였는데, 최척은 활쏘기와 말타기를 잘했기 때문에 의병에 뽑혀서 동행하게 되었다.","최척은 진중에 있으면서 옥영에 대한 근심과 걱정으로 몸이 아프게 되었다.","혼례를 치르기로 약속한 날이 되어 소장을 올려 휴가를 청하자, 의병장이 화를 내며 말했다.","지금이 어느 때인데 감히 혼사에 대해서 말하느냐?","임금께서도 난리를 당하고 피난을 가서 풀숲을 방황하고 계시니, 이러한 때 신하된 자는 마땅히 창을 베고 잘 겨를도 없어야 할 것이다.","하물며 너는 아직 결혼할 나이도 되지 않았으니, 도적을 모두 물리치고 난 뒤에 결혼식을 올리더라도 늦지 않을 것이다.","의병장은 이렇듯 꾸짖으며 끝내 최척의 귀가를 허락하지 않았다.","옥영도 최생이 종군하여 돌아오지 않자 혼례를 치르지 못하고 그 날을 헛되게 보낼 수밖에 없었다.","이후로 옥영은 밥을 먹거나 잠을 자지 못하였으며, 날이 갈수록 근심만 깊어 갔다.","이때 남원부중에 양생이란 사람이 있었는데, 집안이 매우 부유하였다.","그는 옥영이 어질고 똑똑하며, 최척이 진중에서 돌아오지 않았다는 말을 들었다.","그래서 이 틈을 이용해 옥영에게 구혼하기 위해 몰래 뇌물을 주어 정공의 아내와 결탁하였다.","옥영을 양생과 혼인시키도록 권하며 말했다.","최생은 매우 가난해 아침에는 저녁 때 먹을 것이 없어 동쪽에서 빌리고 서쪽에서 구걸해야 하는데, 어느 겨를에 부모를 모실 수 있겠습니까?","하물며 지금은 최생이 종군해서 돌아오지도 못하고 있으니, 그의 생사를 기약하기도 어렵습니다.","그러나 양생의 집안은 매우 부유하여 본래부터 재물이 많기로 소문이 나 있으며, 그 아들도 최생 못지 않게 현명합니다.","이렇듯이 정공 부부가 번갈아 가며 권하자, 심씨는 자못 유혹에 넘어가 즉시 양생과 옥영의 혼인을 허락하고, 10월로 날짜를 잡아 혼례를 치르기로 약속하였다.","마치 ‘많은 사람들이 한결같이 말하니 감옥인들 깨뜨리지 못하리요.’하는 꼴이 된 것이다.","이 사실을 알게 된 옥영은 밤에 어머니를 찾아가 눈물로 호소하며 말했다.","최생의 거취는 의병장의 손에 달려 있기 때문에 최생이 자기 마음대로 오지 않은 것은 아닙니다.","그런데 최생의 말을 기다리지도 않고 곧바로 언약을 저버리시니, 이보다 옳지 못한 사람이 또 어디 있겠습니까?","만약 제 의지를 꺾으려 하신다면 저는 죽어도 다른 곳으로는 시집가지 않겠습니다.","하늘같은 어머니께서도 몰라주시는데 남들이 어떻게 제 마음을 헤아리겠습니까?","어머니가 말했다.","너는 어찌 이렇듯 심하게 고집을 부리느냐?","아아, 어린 네가 무엇을 알겠느냐?","너는 마땅히 이 어미가 시키는 대로 따라야 할 것이다.","심씨는 딸의 말을 용납하지 않고, 또 더 들을 생각도 없어 곧 잠자리에 들었다.","한밤에 심씨가 깊이 잠들어 있었는데, 문득 숨이 차서 헐떡거리는 소리가 베갯머리까지 세차게 들려 왔다.","잠에서 깨어나 딸이 자던 자리를 어루만져 보니, 딸이 그 자리에 없었다.","놀라 자리에서 일어나 다급히 찾아보니, 옥영이 비단 수건으로 목을 메고 창살 아래 엎드려 있었다.","손발이 모두 차고 숨소리가 점차 희미해졌으며, 호흡만 목구멍 속에서 오락가락하였다.","심씨는 황망히 목에 메인 수건을 풀고 옥영을 끌어안아 일으켰다.","이때 춘생이 등불을 밝히고 와서 물을 몇 모금 입에 흘려 넣자, 옥영이 겨우 입으로 숨을 내쉬었다.","잠시 후 옥영이 깨어남에 온 집안이 발칵 뒤집혀 너나 없이 옥영을 구완하였으며, 이 이후로는 어느 누구도 양씨 집안과의 혼사 이야기를 꺼내지 않았다.","이때 최숙은 아들에게 편지를 보내어 양씨 집안과의 혼사 문제 등 그 동안의 모든 사실을 다 알려 주었다.","최척은 바야흐로 옥영에 대한 그리움으로 오래도록 병이 낫지 않고 침상에 누워 있었는데, 이 소식을 듣고는 병과 그리움이 두 배나 더 심해졌다.","의병장은 이 이야기를 듣고 즉시 최척을 진중에서 내어보내 집으로 돌아가게 하였다.","집으로 돌아온 최척은 며칠 동안 몸을 조리하고 난 뒤에 점차 병이 낫기 시작하였다.","그리하여 마침내 11월 초하룻날 정진사 집에서 혼례를 치렀다.","아름다운 두 남녀가 서로 합치게 되니, 그 기쁨이란 이루 말할 수 없었다.","혼례를 마친 후 최척이 아내와 장모를 모시고 집으로 돌아옴에 하인과 노비들이 모두 기뻐하였다.","대청에 오르자 친척들이 축하하여 온 집안에 기쁨이 넘쳐흘렀으며, 이들을 기리는 소리가 사방의 이웃으로 퍼져 나갔다.","시집에 온 옥영은 소매를 걷어붙이고 머리를 빗어 올린 채 손수 물을 긷고 절구질을 하였으며, 시아버지를 봉양하고 남편을 섬길 때는 효도와 정성을 다하고, 이웃 사람들이 이 이야기를 듣고는 모두 양홍의 처나 포선의 아내도 이보다는 낫지 않을 것이라고 칭찬하였다.","최척은 아내를 얻은 이후 구하는 것이 뜻대로 되어 재산이 점차 넉넉하게 불어났으나, 다만 일찍이 자식이 없는 것이 걱정이었다.","최척 부부는 후사를 염려하여 매월 초하루가 되면 몸과 마음을 깨끗이 하고 함께 만복사에 올라가 부처께 기도를 올렸다.","다음 해인 갑오는 정월 초하루에도 만복사에 올라가 기도를 하였는데, 이날 밤 장육금불이 옥영의 꿈에 나타나 말했다.","나는 만복사의 부처로다.","너희 정성이 가상하여 기이한 사내아이를 점지해 주니, 태어나면 반드시 특이한 일이 있을 것이다.","옥영은 그 달에 바로 잉태하여 10개월 후에 과연 아들을 낳았는데, 등위에 어린아이 손바닥만한 붉은 점이 있었다.","그래서 마침내 최척은 아들 이름을 몽석이라고 지었다.","최척은 피리를 잘 불었으며, 매번 꽃피는 아침과 달뜨는 저녁이 되면 아내와 함께 피리를 불곤 하였다.","일찍이 날씨가 맑은 어느 봄날 밤이었는데, 어둠이 깊어 갈 무렵 미풍이 잠깐 일어나면서 밝은 달이 환하게 비추었으며, 바람에 날리던 꽃잎이 옷에 떨어져 그윽한 향기가 코끝에 스며들었다.","이에 최척과 옥영은 술병을 열고 술을 따라 마신 후, 침상에 기대어 피리를 세 곡조 부니 그 여음이 하늘거리며 퍼져나갔다.","옥영이 한동안 침묵에 잠겨 있다가 말했다.","저는 본래부터 아녀자가 시를 읊는 것을 싫어했습니다.","그런데 이처럼 맑은 정경을 대하니 도저히 참을 수가 없군요.","옥영은 마침내 절구 한 수를 읊었다.","왕자진이 피리를 부니 달도 내려와 들으려 하는데,","바다처럼 푸른 하늘엔 이슬이 서늘하네.","때마침 날아가는 푸른 난새를 함께 타고서도,","안개와 놀이 가득하여 봉도 가는 길 찾을 수 없네.","최척은 애초에 자기 아내가 이렇듯 시를 잘 읊조리는 줄 모르고 있었던 터라 놀라고 또 감탄을 한 후, 즉시 그 시에 화답하여 읊었다.","아득한 요대엔 새벽 구름이 떠다니고,","맑은 난소의 곡조는 끊이지 않네.","여향 공중에 울려 퍼짐에 달은 떨어지려 하고,","뜰에 드리운 꽃 그림자는 향기로운 바람에 날리네.","최척이 읊기를 마치자, 옥영은 더없이 기뻤다.","그러나 옥영은 즐거움이 다 하면 슬픔이 온다는 것을 아는지라, 처연히 최척의 손을 잡고 눈물을 흘리면서 말했다.","인간 세상에는 뜻하지 않는 변고가 있고, 좋은 일은 귀신이 시기하는 법입니다.","우리가 일생을 살아가는 동안에 몇 번이나 헤어지고 다시 만날 지 기약하기 어렵습니다.","저는 항상 이것이 근심스러워 마음이 절로 슬퍼지곤 합니다.","최척이 눈물을 닦아주며 위로하여 말했다.","굽었다가 펴지고 가득 찼다가 텅 비게 되는 것이 천도의 항상 된 이치요, 길흉과 회한은 사람이 살아가는 동안 당연히 겪을 일일 것이오.","만약 불행히 하늘에서 부여한 운명을 맞이하게 되더라도 어떻게 슬픈 처지를 한탄하면서 몸과 마음을 게을리 할 수가 있겠소?","부질없는 근심과 고민으로 즐거운 마음을 해칠 필요는 없소.","이 이후로 최척과 옥영의 애정은 더욱 돈독해졌으며, 서로를 지음으로 자처하면서 하루도 떨어져 생활하는 일이 없었다.","정유년 8월에 왜구가 남원을 함락하자 사람들이 모두 피난 가 숨었으며, 최척의 가족들도 지리산 연곡사로 피난을 갔다.","최척은 옥영에게 남장을 하게 했는데, 뭇 사람에 뒤섞이어도 보는 사람들마다 옥영이 여자인 줄을 몰랐다.","지리산으로 들어온 지 며칠이 지나자 양식이 다 떨어져 거의 굶주리게 되었다.","최척은 장정 서너 사람과 함께 양식도 구하고 왜적의 형세도 살펴볼 겸 산에서 내려왔다.","최척 일행은 구례에 이르러서 갑자기 적병을 만나게 되었는데, 모두 바위 골짜기에 몸을 숨겨 겨우 붙잡히는 것을 면했다.","이날 왜적들은 연곡사로 가득히 쳐들어가 아무 것도 남기지 않고 다 약탈해 갔다.","최척 일행은 길이 막혀 3일 동안이나 오도가도 못하고 숨어 있었다.","왜적들이 물러가기를 기다렸다가 간신히 연곡사로 들어가 보니, 시체가 절에 가득히 쌓여 있고 피가 흘러 내를 이루고 있었다.","그런데 이때 숲 속에서 신음소리가 은은히 들려왔다.","최척이 달려가 보니, 노인 몇 사람이 온 몸에 상처를 입고 신음하고 있었다.","노인들은 최척을 보자 통곡하며 말했다.","적병이 산에 들어와서 3일 동안 재물을 약탈하고 인민들을 베어 죽였으며, 아이들과 여자들은 모두 끌고 어제 겨우 섬진강으로 물러갔네.","자네 가족들을 찾고 싶으면 물가에 가서 물어 보게나.","최척은 하늘을 부르짖으며 통곡하고 땅을 치며 피를 토한 뒤, 즉시 섬진강으로 달려갔다.","몇 리도 채 못 갔는데, 문득 어지럽게 널려진 시신들 속에서 신음소리가 들렸다.","그 소리는 끊겼다 이어졌다 해서 소리가 나는 것인지 아닌지 분간하기도 어려웠다.","가서 보니 온 몸이 칼로 베이고 흐르는 피가 얼굴에 낭자하여 어떤 사람인지 알아 볼 수가 없었다.","그가 입고 있는 옷을 살펴보니 춘생이 입고 있던 것과 비슷했다.","그래서 최척은 큰 소리로 불러 말했다.","너는 춘생이 아니냐?","춘생이 눈을 들어보더니, 얼굴이 비참하게 일그러지며 기어드는 목소리로 희미하게 몇 마디를 중얼거렸다.","낭군이시여, 낭군이시여!","아아, 애통합니다!","주인 어른의 가족들은 모두 적병에게 끌려갔으며, 저는 어린 몽석을 등에 업고 달아났으나 빨리 달릴 수가 없어 적병의 칼에 맞게 되었습니다.","그 즉시 저는 땅에 넘어져 기절했다가 반나절만에 깨어났는데, 등에 업혔던 아이는 죽었는지 살았는지 알 수가 없습니다.","춘생은 말을 마치더니 이내 죽고 말았다.","최척은 주먹으로 가슴을 치고, 땅에 쓰러져 기절했다가 한참 후에야 깨어났다.","이윽고 정신을 가다듬어 섬진강으로 가서 보니, 강둑 위에 상처를 입고 쓰러진 수십 명의 노약자들이 서로 모여서 통곡을 하고 있었다.","최척이 다가가서 묻자, 노인들이 대답했다.","산 속에 숨어 있다가 왜적에게 여기까지 끌려 왔네.","왜적들은 여기에서 장정들만 가려 배에 실어 가고, 이처럼 병이 들거나 칼에 찔린 노약자들은 버려 두었네.","최척은 이 이야기를 듣고 대성통곡을 하였다.","혼자만 온전하게 살아남을 수 없다고 생각하여 자살을 하려고 했으나, 주위 사람들이 만류하여 죽을 수도 없었다.","그래서 강의 상류로 터덜터덜 걸어올라 갔는데, 막상 돌아갈 곳도 없었다.","샛길을 찾아 겨우 고향에 이르러서보니, 담벼락은 무너지거나 깨어져 있었다.","그 밖의 다른 것들도 모두 불타버려 쉴 곳은 물론, 곳곳에 시체가 언덕처럼 쌓여 발 디딜 틈도 없었다.","마침내 최척이 금교 옆에 주저앉아 쉬고 있는데, 문득 어떤 당나라 장수가 10여 명의 말 탄 병사를 거느리고 성안에서 나와 금교 아래에서 말을 씻기었다.","최척은 의병으로 출전했을 때 당나라 장수들을 대접하기 위해 그들과 오래도록 술을 마신 터라, 중국말을 조금은 알고 있었다.","그래서 최척은 그 장수에게 자기 집안이 전몰하게 된 사실을 이야기하고, 또 자기 한 몸마저 의탁할 곳이 없어 함께 중국으로 들어가 목숨이나 부지했으면 좋겠다고 호소하였다.","당나라 장수는 최척의 말을 듣고 슬퍼하였으며, 또 최척의 뜻을 불쌍하게 여겨 말했다.","나는 오총병에 속해 있는 천총인 여유문이오.","집은 절강성 소흥부에 있으며, 재산은 비록 넉넉지 않으나 먹고살기에는 부족함이 없소.","인생이란 서로의 마음을 알아주는 것이 소중하니, 가고 아니 가고는 그대의 뜻대로 하시오.","게다가 나는 이미 집안 일에 연연하지 않고 장차 멀리 유람할 계획을 갖고 있소.","그런데 어찌 반드시 홀로 한 가지 방책만 고수하여 소심하게 그대의 뜻을 받아들이지 못하겠소.","마침내 최척은 말 한 필을 얻어 타고 당나라 진중으로 들어갔다.","최척은 용모가 준수하고 지략이 심원하였으며, 활쏘기와 말타기를 잘하고 한문도 잘 알고 있었다.","그래서 여공은 최척을 매우 아껴 같은 막사에서 식사를 하고 잠도 같이 잤다.","얼마 뒤 총병이 병사들을 철수하여 중국으로 돌아감에, 최척은 전투와 삼군의 장부를 담당하는 임무를 맡아 국경의 관문을 통과하여 소흥부에서 살았다.","한편, 최척의 가족들은 포로가 되어 강까지 끌려 왔는데, 적병들은 최척의 부친과 장모가 늙고 병이 들어 달아나지 못하리라 생각하고 방비를 소홀히 하였다.","최척의 부친과 장모는 적들이 방심하는 순간을 틈타 몰래 갈대 숲 속으로 달아나 숨었다.","이윽고 왜적들이 물러가자, 두 사람은 갈대 숲에서 나와 이 고을 저 마을을 구걸하며 떠돌다가 마침내 연곡사로 굴러들게 되었다.","그런데 승방에서 어린아이의 구슬픈 울음소리가 들려 왔다.","이에 심씨가 울면서 최숙에게 말했다.","이것이 어떤 아이의 소리입니까?","꼭 우리 아이의 울음소리 같습니다.","최숙이 문을 열어서 보니 바로 몽석이었다.","마침내 최숙은 기이한 인연에 놀라며, 아이를 품에 안고 울음을 달래었다.","그리고 몽석을 안고 나오면서 스님에게 물었다.","이 아이가 어디서 이곳으로 왔습니까?","혜정이라는 스님이 말했다.","수북하게 쌓여 있는 시체더미 속에서 이 아이가 응애응애 울면서 기어 나왔는데, 제가 그 모습이 하도 불쌍하여 이곳으로 데리고 와 아이의 부모를 기다리고 있었던 것입니다.","이 아이가 살아난 것은 곧 하늘이 내려주신 복입니다.","어찌 사람의 힘으로 할 수 있는 일이겠습니까?","최숙은 손자 아이를 심씨와 번갈아 업어가면서 집으로 돌아와 흩어졌던 노복들을 거둬들이고, 집안 일을 돌보면서 함께 의지해 살았다.","이때 옥영은 왜병인 돈우에게 붙들렸는데, 돈우는 인자한 사람으로 살생을 좋아하지 않았다.","그는 본래 부처님을 섬기면서 장사를 업으로 삼고 있었으나, 배를 잘 저었기 때문에 왜장인 평행장이 뱃사공의 우두머리로 삼아 데려왔던 것이다.","돈우는 옥영의 영특한 면모를 사랑하였다.","옥영이 붙들린 채 두려움에 떠는 것을 보고 좋은 옷을 입히고 맛있는 음식을 먹이면서 옥영의 마음을 달래었다.","그러나 옥영이 여자인 줄은 끝내 몰랐다.","옥영은 물에 빠져 죽으려고 두세 번 바다에 뛰어 들었으나, 사람들이 번번이 구출해서 결국 죽지 못하고 말았다.","어느 날 저녁이었다.","옥영의 꿈에 장육금불이 나타나 분명하게 말했다.","\"삼가 죽지 않도록 해라.","후에 반드시 기쁜 일이 있을 것이다.\"","옥영은 깨어나 그 꿈을 기억해 내고는 전혀 희망이 없는 것은 아니라고 생각했다.","그래서 마침내 억지로라도 밥을 먹으며 죽지 않고 살아남았다.","돈우의 집은 낭고사에 있었는데, 집에는 늙은 아내와 어린 딸만 있고 다른 사내는 없었다.","돈우는 옥영을 집안에서만 생활하고 다른 곳에는 일체 나가지 못하게 하였다.","이에 옥영은 돈우에게 거짓말로 일렀다.","저는 단지 어린 사내로 약질에다가 병이 많습니다.","예전에 본국에 있을 때에도 남자들의 일을 감당할 수가 없어 오로지 바느질과 밥 짓는 일만을 했습니다.","돈우는 더욱 불쌍하게 생각하여 옥영에게 사우라는 이름을 지어 주었다.","그는 배를 타고 장사를 다닐 때마다 옥영을 데리고 가서 부엌일을 맡겼다.","그래서 옥영은 배 안에 있으면서 민절의 사이를 왕래하였다.","이때 최척은 소흥부에 살면서 여공과 의형제를 맺었다.","여공이 자신의 누이를 최척에게 시집보내려 하자, 최척이 완고하게 사양하며 말했다.","저는 온 집안이 왜적에게 함몰되어 늙으신 아버지와 허약한 아내가 살았는지 죽었는지 아직까지 모르고 있습니다.","그래서 죽을 때까지 상복을 벗을 수 없을 지도 모르는데, 어떻게 마음놓고 아내를 얻어 편안한 생활을 꾀할 수 있겠습니까?","이에 여공은 더 이상 이 문제에 대해서 논의하지 않았다.","그 해 겨울에 여공은 병으로 인해 죽고 말았다.","최척은 또다시 갈 곳이 없어 강호를 떠돌며 두루 명승지를 유람하였다.","용문과 우혈을 살펴보고, 소상강과 동정호를 유람하였으며, 악양루와 고소대에도 올라갔다.","이렇듯 최척은 강산을 떠돌며 시를 읊조리고 구름과 물 사이를 배회하다가, 마침내 소심하게 사물에 얽매여 근심하지 않고 바람 따라 떠돌며 한 세상을 보내리라 마음먹게 되었다.","이러는 사이에 해상의 섬도사 왕은이라는 사람이 아미산 아래에 살고 있는데, 금련단을 달여 먹고 대낮에 하늘을 날수 있는 재주를 가졌다는 말을 들었다.","그래서 최척은 장차 촉 땅으로 가 그에게 선술을 배우려고 하였다.","때마침 주우라는 사람이 있었는데 호를 학천이라고 했으며, 집이 용금문 밖에 있었다.","그는 경전과 사서에 두루 통했으나 공명을 달갑게 여기지 아니하고 물건 매매를 생업으로 삼았으며, 남에게 베풀기를 좋아하고 의기를 숭상하였다.","최척과는 예전부터 절친하게 지내는 사이였는데, 최척이 촉으로 간다는 소식을 듣고 술을 가지고 왔다.","주우는 술잔을 들고 최척의 자를 부르며 말했다.","백승아!","백승아!","사람이 이 세상을 살아가면서 누군들 오래 살고 싶지 않겠는가?","그러나 고금천하를 오래도록 보아 왔지만 죽지 않은 사람이 어디에 있었는가?","남은 인생이 얼마나 된다고 음식을 물리치고 배고픔을 참는 등 스스로를 괴롭히면서 산에 사는 귀신과 이웃이 되려고 하는가?","자네는 모름지기 나에게 와서 나와 함께 사는 것이 좋겠네.","일엽편주에 몸을 싣고 오로지 마음이 내키는 대로 다니며, 아침저녁으로 오 땅과 초 땅을 오가며 비단과 차를 팔고 다니세.","이렇게 강호를 유랑하며 남은 인생을 즐기는 것이 바로 달인의 경지요, 세상 사람들이 말하는 '지상의 신선이 하늘에서 노니는 것을 배웠다'고 하는 것이 아니겠는가?","최척은 주우의 말을 듣고 확연하게 깨달은 바가 있었다.","그래서 주우와 함께 가게 되었는데, 이때가 경자년 늦봄이었다.","최척과 주우는 배를 타고 이곳 저곳을 돌아다니며 차를 팔다가 마침내 안남에 이르게 되었다.","이때 일본인 상선 10여 척도 강 어구에 정박하여 10여 일을 함께 머물게 되었다.","날짜는 어느덧 4월 보름이 되어 있었다.","하늘에는 구름 한 점 없고 물은 비단결처럼 빛났으며, 바람이 불지 않아 물결 또한 잔잔하였다.","이 날 밤이 장차 깊어 가면서 밝은 달이 강에 비추고 옅은 안개가 물위에 어리었으며, 뱃사람들은 모두 깊은 잠에 빠지고 물새만이 간간이 울고 있었다.","이때 문득 일본인 배 안에서 염불하는 소리가 은은히 들려 왔는데, 그 소리가 매우 구슬펐다.","최척은 홀로 선창에 기대어 있다가 이 소리를 듣고 자신의 신세가 처량하게 느껴졌다.","그래서 즉시 행장에서 피리를 꺼내 몇 곡을 불어서 가슴속에 맺힌 회한을 풀었다.","때마침 바다와 하늘은 고요하고 구름과 안개가 걷히니, 애절한 가락과 그윽한 흐느낌이 피리 소리에 뒤섞이어 맑게 퍼져나갔다.","이에 수많은 뱃사람들이 놀라 잠에서 깨어났으며, 그들은 처연하게 앉아 피리 소리에 조용히 귀를 기울였다.","격분해서 머리가 곧추 선 사람도 피리 소리에 분을 가라앉힐 정도였다.","잠시 후에 일본인 배 안에서 조선말로 칠언절구를 읊었다.","왕자진의 피리 소리에 달마저 떨어지려 하는데,","바다처럼 푸른 하늘엔 이슬만 서늘하구나.","시를 읊는 소리는 처절하여 마치 원망하는 듯, 호소하는 듯 하였다.","시를 다 읊더니, 그 사람은 길게 한숨을 내쉬었다.","최척은 그 시를 듣고 크게 놀라서 피리를 땅에 떨어뜨린 것도 깨닫지 못한 채, 마치 실성한 사람처럼 멍하니 서 있었다.","이를 보고 학천이 말했다.","어디 안 좋은 곳이라도 있는가?","최척은 대답을 하고 싶었으나 목에 메이고 눈물이 떨어져 말을 할 수 없었다.","시간이 조금 흐른 뒤에 최척은 기운을 차려 말했다.","조금 전에 저 배 안에서 들려왔던 시구는 바로 내 아내가 손수 지은 것이라네.","다른 사람은 평생 저 시를 들어도 절대 알아내지 못할 것일세.","게다가 시를 읊는 소리마저 내 아내의 목소리와 너무 비슷해 절로 마음이 슬퍼진 것이라네.","어떻게 내 아내가 여기까지 와서 저 배 안에 있을 수 있겠는가?","이어서 온 가족이 포로로 잡혀간 일을 말하자, 배 안에 있던 사람들 가운데 비탄에 젖지 않은 사람이 없었다.","그 가운데는 두홍이라는 사람이 있었는데, 젊고 용맹한 장정이었다.","그는 최척의 말을 듣더니, 얼굴에 의기를 띠고 주먹으로 노를 치면서 분연히 일어나며 말했다.","내가 가서 알아보고 오겠소.","학천이 저지하며 말했다.","깊은 밤에 시끄럽게 굴면 많은 사람들이 동요할까 두렵네.","내일 아침에 조용히 물어 보아도 늦지 않을 것일세.","주위 사람들이 모두 말했다.","그럽시다.","최척은 앉은 채로 아침이 되기를 기다렸다.","동방이 밝아오자, 즉시 강둑을 내려가 일본인 배에 이르러 조선말로 물었다.","어젯밤에 시조를 읊던 사람은 조선 사람 아닙니까?","나도 조선 사람이기 때문에 한 번 만나 보았으면 합니다.","멀리 다른 나라를 떠도는 사람이 비슷하게 생긴 고국 사람을 만나는 것이 어찌 기쁘기만 한 일이겠습니까?","옥영도 어젯밤에 들려왔던 피리 소리가 조선의 곡조인데다, 평소에 익히 들었던 것과 너무나 흡사하였다.","그래서 남편 생각에 감회가 일어 저절로 시를 읊게 되었던 것이다.","옥영은 자기를 찾는 사람의 목소리를 듣고는 황망하게 뛰어나와 최척을 보았다.","두 사람은 서로 마주 바라보고는 놀라서 소리를 지르며 끌어안고 백사장을 뒹굴었다.","목에 메이고 기가 막혀 마음을 안정할 수가 없었으며, 말도 할 수 없었다.","눈에서는 눈물이 다하자 피가 흘러내려 서로를 볼 수도 없을 지경이었다.","두 나라의 뱃사람들이 저자 거리처럼 모여들어 구경하였는데, 처음에는 다만 친척이나 잘 아는 친구인 줄로만 알았다.","뒤에 그들이 부부 사이라는 것을 알고 사람마다 돌아보며 소리쳐 말했다.","이상하고 기이한 일이로다!","이것은 하늘의 뜻이요, 사람이 이룰 수 있는 일이 아니로다.","이런 일은 옛날에도 들어보지 못하였다.","최척은 옥영에게 그간의 소식을 물으며 말했다.","산 속에서 붙들리어 강가로 끌려갔다는데, 그때 아버님과 장모님은 어떻게 되었소?","옥영이 말했다.","날이 어두워진 뒤에 배에 오른 데다 정신이 없어 서로 잃어버리게 되었으니, 제가 두 분의 안위를 어떻게 알겠습니까?","두 사람이 손을 붙들고 통곡하자, 옆에서 지켜보던 사람들도 슬퍼하며 눈물을 닦지 않는 이가 없었다.","학천은 돈우를 만나 백금 세 덩이를 주고 옥영을 사서 데려 오려고 하였다.","그러자 돈우가 얼굴을 붉히며 말했다.","내가 이 사람을 얻은 지 이제 4년 되었는데, 그의 단정하고 고운 마음씨를 사랑하여 친자식처럼 생각해 왔습니다.","그래서 침식을 함께 하는 등 잠시도 떨어진 적이 없었으나, 지금까지 아낙네인 것을 몰랐습니다.","오늘 이런 일을 직접 겪고 보니, 이는 천지신명도 오히려 감동할 일입니다.","내가 비록 어리석고 무디기는 하지만 진실로 목석은 아닙니다.","그런데 차마 어떻게 그를 팔아서 먹고 살 수 있겠습니까?","돈우는 즉시 주머니 속에서 은자 10냥을 꺼내어 전별금으로 주면서 말했다.","4년을 함께 살다가 하루아침에 이별하게 되니, 슬픈 마음에 가슴이 저리기만 하오, 온갖 고생 끝에 살아 남아 다시 배우자를 만나게 된 것은 실로 기이한 일이며, 이 세상에 없었던 일일 것이오.","내가 그대를 막는다면 하늘이 반드시 나를 미워할 것이오.","사우여!","사우여!","잘 가시게!","잘 가시게!","옥영이 손을 들어 감사를 드리며 말했다.","일찍이 주인 영감님께서 보호해 주신 덕분에 지금까지 죽지 않고 살아오다가 뜻밖에 낭군을 만나게 되었으니, 제가 받은 은혜가 이미 끝없이 많기만 합니다.","게다가 이렇듯이 기뻐하며 전별금까지 주시니 진실로 그 은혜를 잊지 않겠으며, 백 번 절하여 감사 드립니다.","최척이 옥영과 함께 본 배로 돌아오자 이웃 배에서는 이들을 보러 오는 사람들이 연일 끊이지 않았으며, 어떤 사람들은 금은과 비단을 주기까지 했다.","학천은 집으로 돌아와 별도로 방 하나를 깨끗이 청소하고 최척과 옥영을 그곳에 살게 하였다.","최척은 이미 아내를 만났기 때문에 더 이상 바랄 것이 없었다.","그러나 머나먼 이국 땅에 의탁해 살고 있는 터라, 사방을 둘러보아도 친척 하나 없었다.","그래서 항상 늙은 아버지와 어린 아들 생각에 눈물이 마른 적이 없었으며, 밤낮을 가리지 않고 상심에 쌓여 있었다.","최척은 머나먼 이국 땅에서 더 이상 살 마음이 없었기 때문에 살아서 고향에 돌아가게 해달라고 묵묵히 기도하였다.","그러나 세월은 끊임없이 흘러서 최척은 또 아들 하나를 낳았다.","아이를 낳기 전에 장육금불이 또 꿈에 나타나서 말했다.","이번에 낳는 아들도 등에 붉은 사마귀가 있을 것이로다.","최척 부부는 부처님께 감사 드리고, 몽석이 다시 태어난 것으로 여겨 이름을 몽선이라고 지었다.","몽선이 이윽고 장성하여 어진 아내를 구하고자 하였다.","이웃에 진가의 딸이 살고 있었는데, 이름은 홍도였다.","홍도가 젖을 떼기도 전에 아버지 위경은 유총병을 따라 조선에 출전했다가 돌아오지 않았으며, 다 자라기도 전에 어머니마저 돌아가시어 홍도는 이모의 집에서 길러졌다.","홍도는 늘 아버지가 타국에서 죽은 것을 슬퍼하고, 이 세상에 태어나서 아버지의 얼굴도 모르는 자신의 처지를 한탄하였다.","그래서 아버지가 죽은 나라에 한 번 가서 넋을 불러 놓고 통곡한 뒤, 시신을 모시고 돌아와 장례를 지내는 것이 홍도의 소원이었다.","홍도는 이렇듯 원한을 뼈와 가슴에 새기고 있었으나, 여자의 몸이라 뜻을 품고도 조선에 갈 수가 없었다.","그래서 몽선이 혼처를 구한다는 소식을 듣기도 전에 이모에게 중매를 부탁하며 말했다.","제 평생의 소원은 최씨의 아내가 되어 한 번 조선에 가서 마음속에 맺힌 원한을 푸는 것입니다.","홍도의 이모는 본래부터 홍도의 뜻을 알고 있었기 때문에 즉시 최척을 만나 홍도가 품은 생각을 대략 이야기하고, 이어서 혼인을 요청하였다.","이에 최척 부부는 매우 기뻐하며 말했다.","어린 여자아이도 이러한 뜻을 두었는데, 우린들 어찌 이러한 마음이 없겠습니까?","마침내 최척은 홍도를 며느리로 맞이하였다.","다음 해 무오년에 오랑캐 추장이 요양으로 쳐들어 와 연달아 몇 개의 진지를 함락하고, 수많은 장졸들을 죽였다.","천자는 크게 화가 나서 온 나라의 모든 병사를 동원하여 이를 토벌케 하였다.","소주 사람인 오세영이 교유격의 부총으로 출전하게 되었는데, 그는 예전에 여유문에게 들어서 최척이 재주가 있고 용맹하다는 것을 잘 알고 있었다.","그래서 최척을 서기로 삼아 데려가려고 하였다.","최척이 거절을 할 수 없어 행장을 꾸려 가려고 할 때, 옥영이 손을 잡고 눈물을 흘리며 작별하여 말했다.","저는 타고난 운수가 좋지 않아 일찍이 난리를 만나 천신만고 끝에 간신히 목숨을 부지하였습니다.","하느님의 도움으로 다행히 낭군을 만나, 끊어진 거문고 줄을 다시 잇고 나뉜 거울을 다시 둥글게 하듯이, 이미 끊어진 인연을 다시 맺었습니다.","게다가 늙어서 의탁할 아들까지 얻어 함께 24년 동안을 즐겁게 살아왔습니다.","지난 일을 돌아보건대, 이제 죽어도 여한이 없습니다.","저는 항상 이 몸이 먼저 갑자기 죽어 낭군의 은혜에 보답하고 싶었기 때문에 늙어 가는 것을 걱정하지 않았습니다.","그런데 또 이렇듯 이별하게 되었으니, 이제 수 만리나 떨어진 요양으로 가시면 다시 살아서 돌아오기 어려울 것입니다.","원컨대, 불미스러운 제가 이별하는 자리에서 자결하여 한편으로는 낭군께서 아내를 그리워하는 마음을 끊고, 다른 한편으로는 밤낮으로 겪게 될 제 근심에서 벗어나고자 합니다.","아아!","이제 낭군을 영영 이별하게 되었으니, 낭군께서는 천금같이 몸을 스스로 잘 보존하시기를 간절히 바라옵니다.","옥영은 말을 마치고 칼을 뽑아서 목을 찌르려고 하였다.","최척이 칼을 빼앗으며 달래어 말했다.","하찮은 오랑캐 추장이 감히 팔을 걷어붙이고 달려들기에 제왕의 군대가 깨끗이 쓸어버리기 위해 가는 것이니, 형세는 계란을 깨는 것과 같소.","멀리 이역에 종군한다고 해서 어찌 반드시 다 죽겠소?","삼가 근심하거나 고민하지 마시오.","내가 공을 이루고 돌아오면 중당에 술상을 차려 놓고 맞이하여 축하나 해주시오.","하물며 몽선이 건장하여 의지하기에 부족함이 없으니 되도록 많이 먹고, 먼길을 가는 사람에게 걱정을 끼치지 마시오.","마침내 최척을 포함한 명나라 군사는 길을 떠나 요양에 이르렀으며, 여기에서 오랑캐 땅으로 수백 리 걸어 들어가 조선 군사와 우미새에 진을 쳤다.","그러나 주장이 적을 가볍게 여기고 싸우다가 전군이 크게 패하였다.","오랑캐들은 명나라 병사는 부류를 가리지 않고 다 죽이되, 조선 병사는 유혹하거나 위협하기만 하고 하나도 죽이지 않았다.","이에 교유격이 패졸 10여명을 거느리고 조선 진영으로 들어가 조선옷을 구걸하자, 조선의 원수인 강홍립은 남은 옷을 지급하여 죽음을 면하게 하였다.","그런데 종사관 이민환이 이러한 사실이 오랑캐에게 발각될까 두려워 다시 옷을 뺏고 중국 사람들을 붙잡아 적진에 보내버렸다.","최척은 본래 조선 사람이었기 때문에 분주하고 어지러운 순간을 틈타 명나라 사람을 세워놓은 줄에서 홀로 빠져 나와 죽음을 면하였다.","강홍립이 투항하자 최척은 조선의 장졸들과 함께 오랑캐 추장의 뜰에 감금되었다.","이때 몽석도 남원에서 무예를 익히다가 출전하여 원수의 진중에 있었다.","오랑캐가 항복한 군졸들을 나누어 놓을 때 최척은 몽석과 같은 곳에 갇히게 되었다.","그래서 부자가 서로 만나게 되었으나, 최척은 그가 어떤 사람인지를 몰랐다.","몽석은 최척이 말을 더듬거리는 것을 보고, 조선말을 할 줄 아는 명나라 병사가 죽음을 당할까 두려워서 조선 사람 행세를 한다고 의심했다.","그래서 최척에게 어디에서 왔느냐고 따져 물었다.","최척도 오랑캐가 실상을 조사하는 것으로 의심해 말을 이리 돌리며 전라도에 있었다고 하기도 하고, 충청도에 산다고 말하기도 했다.","몽석은 마음속으로 더욱 이상하게 생각했으나 그 실상을 알 수가 없었다.","이윽고 몇 개월이 지난 후에 최척과 몽석은 정의가 매우 두터워지고 서로 동병상련하는 처지인지라, 조금도 시기하거나 의심하지 않게 되었다.","최척은 마침내 자기가 평생 겪어왔던 내력을 조금도 숨김없이 사실대로 털어놓게 되었다.","몽석은 최척의 말을 듣고 놀라서 낯빛이 변하더니, 슬픈 듯 기쁜 듯 어쩔 줄을 몰라 하다가 갑자기 물었다.","잃어버린 아이는 나이가 몇 살이며, 신체의 모양은 어떻게 생겼습니까?","최척이 말했다.","갑오년 10월에 아이를 낳았으며, 정유년 8월에 잃어버렸다네.","그리고 등위에 붉은 사마귀가 있는데, 마치 어린아이의 손바닥 같다네.","몽석이 말을 못하고 놀라 쓰러졌다가 윗통을 벗어 등을 보이며 말했다.","제가 바로 그 아이입니다.","최척은 비로소 몽석이 자기 아들임을 확인한 후 부친과 장모님의 생사 여부를 물었으며, 그들이 아직 살아 있다는 것을 알고는 희비가 교체하여 서로 붙들고 통곡하였다.","집주인인 늙은 오랑캐가 자주 와서 이 광경을 보더니, 그들의 말을 알아들은 듯이 가엾은 표정을 지었다.","하루는 다른 오랑캐들이 모두 밖으로 나간 사이에 늙은 오랑캐가 몰래 와서 함께 자리에 앉아 조선말로 물었다.","당신들이 서로 붙들고 통곡을 했는데, 이는 반드시 가슴아픈 사연이 있기 때문일 것이오.","대체 그것이 무슨 일이요?","최척과 몽석은 그가 꾀어서 비밀을 알아내려는 것으로 생각하고, 두려워 곧바로 대답을 하지 않았다.","그러자 그 오랑캐가 말했다.","당신들은 나를 두려워하지 마시오.","나는 본래 삭주의 토병이었는데, 목사의 학정을 견디지 못해 가족을 데리고 오랑캐 땅으로 들어왔소.","여기 온 지 이미 20년이나 되었지요.","오랑캐 사람들은 성격이 진솔하며 가혹하게 수탈하는 일도 없소.","인생은 아침 이슬과 같을 따름인데, 어찌 고초를 겪어야만 하는 고향에 얽매여 두려워 떨면서 살아야겠소?","그래서 난 가족을 이끌고 이 나라로 왔던 것이오.","오랑캐 추장은 나에게 병사 8천 명을 거느리고 조선 병사들이 달아나지 못하도록 감독하게 하였소.","아까 당신들 말을 들어보니 대단히 기이한 일인 듯 했소.","내가 비록 죄를 얻더라도 어떻게 차마 당신들을 보내지 아니하겠소?","마침내 늙은 오랑캐는 식량을 마련하고 샛길을 가르쳐 주면서 최척과 몽석을 풀어 주었다.","이에 최척은 아들을 이끌고 살아서 고국으로 돌아오게 되니, 시급히 부친을 뵙고 싶은 마음에 서둘러 남쪽으로 내려왔다.","도중에 등창이 났으나 치료할 경황이 없었다.","은진에 이르자 종기가 더욱 심해져 더 이상 견디지 못하고 여관으로 들어갔으나, 최척은 호흡이 실낱처럼 가늘어져 거의 죽을 듯이 헐떡거렸다.","몽석은 초조한 마음에 이리저리 분주하게 돌아다니며 침쟁이와 약을 찾아 다녔는데, 때마침 신분을 숨기고 도망 다니던 중국 사람이 호남에서 영남으로 가다가 최척의 증세를 보고 놀라서 말했다.","위태롭구나!","위태롭구나!","만약 오늘을 넘긴다면 살릴 수 없을 것입니다.","중국사람은 즉시 주머니에서 조그만 침을 꺼내어 등창의 입구를 터뜨렸다.","그리하여 최척은 다음날 이내 낫게 되었다.","며칠 뒤에 최척이 지팡이를 짚고 고향 마을로 돌아오자, 온 집안 사람이 재생한 사람을 보는 것처럼 놀라며 슬퍼하였다.","할아버지, 아들, 손자 3대가 서로 손을 잡고 목을 끌어안으며 목이 쉬도록 통곡하였으며, 모두들 취한 듯 꿈인 듯 사실이 아닌 것처럼 여겼다.","심씨는 딸을 잃어버린 뒤부터 바보처럼 본심을 잃은 채 오로지 몽석이 살아서 돌아오기만을 기다렸는데, 근래 북쪽으로 원정을 갔던 군사들이 모두 죽었다는 소문을 듣고는 병세가 더욱 심해졌다.","그래서 몇 개월 동안 앓아 누워 자리에서 일어나지도 못하던 심씨는, 몽석이 자기 아버지와 함께 오는 것을 보고 미친 듯이 소리를 지르며 허둥대었다.","게다가 옥영이 아직 살아 있다는 말을 듣고 더욱 슬프고도 기쁜 마음을 억누르지 못하였다.","몽석은 아버지를 살려준 중국 사람의 은혜에 감격하여 장차 후하게 보답하려고 그를 데리고 왔었다.","최척은 가족과의 감격스러운 해후를 마치고 나서 중국 사람에게 물었다.","당신이 중국 사람이라면 집은 어디에 있으며, 성명은 무엇입니까?","중국 사람이 대답했다.","내 성은 진이오.","이름은 위경이며, 집은 항주 용금문 밖에 있습니다.","만력 년간에 조선으로 원정을 온 뒤 유제독 휘하에 있었습니다.","유제독은 전라도 순천에 진을 쳤는데, 하루는 제가 적세를 염탐하다가 주장의 뜻을 어기게 되었습니다.","주장이 장차 군법으로 다스리려고 하기에 밤에 몰래 달아나서 여기에 머물게 된 것입니다.","최척이 이 말을 듣고 매우 기뻐하며 말했다.","당신 집안에 부모와 처자가 있습니까?","중국 사람이 말했다.","집안에 아내와 딸아이 하나만 있었는데, 딸아이는 내가 떠나올 때 낳은 지 채 몇 개월도 지나지 않았었습니다.","최척이 또 물었다.","딸아이의 이름이 무엇입니까?","중국사람이 말했다.","아이를 낳는 날, 마침 이웃 사람이 복숭아를 보내 왔기에 이름을 홍도라고 지었습니다.","최척이 갑자기 그의 손을 잡고 말했다.","괴이하도다!","괴이하도다!","내가 항주에서 당신의 집과 이웃해서 살았었습니다.","당신의 처는 신해년 9월에 병으로 죽고 홍도만 혼자 남게 되었는데, 홍도는 이모부인 오봉림의 집에서 길러져 내가 둘째 며느리로 삼았습니다.","그런데 뜻밖에도 오늘 여기에서 당신을 만나게 되었으니, 참으로 기이한 일입니다.","위경이 이 말을 듣더니 그의 가족들을 본 것처럼 기뻐하였다.","그러면서도 한편으로는 슬픔에 젖어 한바탕 통곡을 하고 말했다.","나는 영남 대구에서 박씨 성을 가진 사람의 집에 의탁해 침술로 생계를 유지해 왔습니다.","이제 당신과 이미 사돈간이 되었으니 내가 이곳으로 옮겨와 서로 의지해 사는 것이 어떻겠습니까?","몽석이 말했다.","공께서는 저의 아버지를 살려주신 은혜가 있을 뿐만 아니라 또한 절친한 인척이기도 합니다.","게다가 제 어머님과 동생이 공의 따님께 의탁해 이미 한 가족을 이루었으니, 여기서 함께 사는 일을 다시 말해 무엇하겠습니까?","그리고 즉시 위경으로 하여금 이사를 해서 바로 이웃에 살게 하였다.","몽석은 어머니가 살아 계시다는 말을 들은 뒤부터는 밤낮 중국으로 들어가서 어머니와 동생을 데려 오려고 하였다.","그래서 아내와 함께 이리저리 고심을 했으나 뾰족한 방법이 없어 떠나지 못하고 있었다.","당시, 옥영은 항주에서 관군이 함몰되었다는 소식을 들었다.","최척도 진중에서 반드시 죽었을 것이라고 생각하고 밤낮으로 통곡하다가, 마침내 자결하기로 결심을 하였다.","그런데 갑자기 꿈속에 장육금불이 나타나 말했다.","삼가 죽지 않도록 하거라.","뒤에 반드시 기쁜 일이 있으리라.","옥영이 잠에서 깨어나 아들에게 꿈 이야기를 하며 말했다.","내가 일본에 끌려갔을 때 물에 빠져 죽으려고 했는데, 남원 만복사의 장육금불이 꿈에 나타나 ‘삼가 죽지 않도록 하거라. 뒤에 반드시 기쁜 일이 있으리라’하였단다.","그러고서 10년 뒤에 안남 바닷가에서 네 아버지를 만났단다.","이제 내가 또 죽으려고 하는데 역시 이런 꿈을 꾸었구나.","너희 형제를 낳아 기른 것이 모두 이 부처님께서 암암리에 도우신 것이니, 네 아버지가 사지에서 벗어난 것이 아니겠느냐?","만약 네 아버지가 살아 계시다면 나의 죽음이 얼마나 한스럽겠느냐?","몽선이 말했다.","얼마 전에 들으니, 오랑캐 추장이 중국 병사들은 다 죽였으나 조선 사람들은 모두 죽음을 면했다고 합니다.","아버님께서 본래 조선 사람이기 때문에 틀림없이 살아 계실 것입니다.","옥영이 갑자기 마음이 바뀌어 말했다.","오랑캐 추장의 소굴이 조선의 국경에서 10일 정도 걸어갈 거리밖에 되지 않는다.","만약 네 아버지가 살아 계시다면 그 형세로 보아 아버님을 찾아 반드시 본국으로 돌아갔을 것이다.","내가 본국으로 찾아가야겠다.","만약 네 아버지가 전사하셨으면, 내가 몸소 창주로 가서 시신을 찾고 넋을 거두어, 고향으로 돌아가 선산에 장사를 지내 외로운 혼백이나마 편케 해야겠다.","월나라 새는 남쪽을 생각하고 오랑캐 말은 북쪽에 기댄단다.","금수도 오히려 이러한데 하물며 사람의 마음이야 어떻겠느냐?","지금까지 나는 이역 땅을 떠돌아 다녔으며, 죽을 날도 얼마 남지 않았다.","그래서 더욱 고향에 대한 그리움을 견딜 수가 없구나.","늙으신 시아버님과 홀어머니를 순식간에 이별하고 품속의 어린 아들마저 갑자기 잃어버린 채, 아직까지 그들의 생사도 모르고 있다.","근래 일본 상인들에게 들으니, 포로가 된 조선 사람들을 연이어 풀어주고 있다는구나.","이 말이 사실이라면 어찌 한 사람이라도 살아서 돌아오지 않았겠느냐?","네 할아버지와 아버지가 혹 이역 땅에서 죽었다면 이제 누가 다시 선인들의 묘소를 돌보겠느냐?","내외 친척들이 난중에 다 죽었다면 필경 돌볼 사람이 없을 것이다.","또 만약 네 할아버지와 아버지를 만나게 된다면 그 얼마나 다행이겠느냐?","너는 모름지기 배를 한 척 사고 양식을 준비해라.","이곳에서 조선까지는 수로로 불과 2, 3천 리밖에 되지 않는다.","하느님께서 돌보시어 혹 순풍을 만나게 된다면 채 열흘도 못되어 우리나라에 당도할 수 있을 것이다.","나는 이미 마음을 정했느니라.","몽선이 울면서 말했다.","어머님께서는 어찌 이런 말씀을 하십니까?","만약 순조롭게 건널 수만 있다면 이는 진실로 천행일 것입니다.","그러나 드넓은 푸른 바다를 작은 배로 항해할 수는 없습니다.","바람과 파도, 상어와 악어가 어떠한 재앙을 일으킬지 예측할 수가 없으며, 해적선들이 도처에서 사납게 굴고 있습니다.","어머니와 제가 물 속에 빠져 죽는다고 해서 돌아가신 아버님께 어떠한 도움이 되겠습니까?","제가 비록 어리석으나 이처럼 큰 일을 앞두고 감히 거절하는 말씀을 올리는 것은 형세가 용이치 않기 때문입니다.","홍도가 옆에 있다가 문득 남편에게 말했다.","낭군이시여!","낭군이시여!","막지 마십시오!","막지 마십시오!","이치가 진실로 당연한 것이라면 외환을 따져서 무엇하겠습니까?","어머님께서 단단히 마음을 정하셨는데, 어찌 물과 불이 두렵겠습니까?","옥영이 말했다.","수로는 험난하긴 하지만 내가 이미 경험을 갖추고 있다.","옛날 일본에 있을 때 배를 집으로 삼아 봄에는 민광에서 장사를 하고, 가을에는 유구에서 물건을 팔았다.","그래서 수시로 출몰하는 거대하고 무서운 파도에도 익숙해 있으며, 별이나 조수의 흐름을 살펴서 점칠 수 있을 정도로 경험이 매우 풍부하다.","험난한 파도도 내가 맡을 것이요, 배의 안전도 내가 알아서 하겠다.","설사 불행한 일이 생기더라도 어찌 벗어날 방도가 없겠느냐?","옥영은 즉시 조선과 일본 두 나라의 옷을 짓고, 매일 아들과 며느리에게 두 나라 말을 가르쳐 익히게 했다.","그리고 날마다 행사와 관련하여 몽선에게 주의를 주며 말했다.","항해가 잘되고 잘못되고는 오로지 돛대와 노에 달려 있으니, 돛대는 촘촘히 기워야 하고 노는 견고해야 한다.","또 없어서는 안될 것이 지남석이다.","항해할 날짜는 내가 정할 것이니 나의 뜻을 어기지 않도록 해라.","몽선이 근심에 어린 채 물러나 사사로이 홍도를 꾸짖으며 말했다.","어머님께서 목숨을 돌보지 않으시고 만 번 죽을 계획을 세우시어, 험난한 바다를 건너 조선으로 돌아가려고 하시네.","그런데 당신은 그 일을 찬성할 뿐 아니라 어머님과 번갈아 가며 나를 위협하기까지 하니, 어찌 차마 못할 일을 이렇듯 심하게 하오?","우리 아버님께서는 이미 돌아가셨는데 어머니마저 어느 곳에다 묻으려 하는 거요?","홍도가 말했다.","어머님께서는 지성으로 이 큰 계획을 세우셨습니다.","진정코 말로써는 막을 수가 없습니다.","혹 돌이키기 어려운 후회를 할까 염려스럽기도 하지만, 지금은 어머님 계획을 순순히 따르는 것보다 좋은 것이 없을 듯합니다.","제 개인적인 마음이야 어찌 말로 다 할 수 있겠습니까?","태어난 지 겨우 몇 개월만에 아버지께서는 다른 나라에서 전사하시어, 이역 땅에 뼈를 드러내 놓은 채 잡초에 뒤엉켜 있습니다.","어머니께서도 제가 몇 살밖에 안 되었을 때 눈을 들어 웃으시더니 등을 보이시고 말았습니다.","그래서 저는 이 세상에 살 마음이 없었습니다.","근래 길거리에서 들으니, 싸움에서 패배한 군졸들 가운데 조선으로 달아나서 떠도는 사람들이 많다고 합니다.","자식된 마음으로 요행을 바라지 않을 수가 없습니다.","만약 낭군의 힘에 의지하여 조선에 당도해서 한 번이라도 전쟁터를 바라보고 아버님의 혼백을 모아 술잔을 올린다면, 외롭게 떠도는 넋이나마 위로할 수 있을 듯합니다.","그러면 저의 끝없는 원통함이 옅어져 아침에 가서 저녁에 죽더라도 실로 달게 여기겠습니다.","홍도는 말을 마치자 흐느껴 울었다.","몽선은 이윽고 어머니와 아내가 똑같이 일을 결행하기로 확실하게 마음을 정해서 이를 꺾거나 바꿀 수 없다는 것을 알게 되었다.","그래서 떠날 준비를 단단히 하고, 경신년 2월 초하루에 닻을 올려 출항키로 했다.","출발할 날짜가 결정되자, 옥영이 아들에게 말했다.","조선은 동북쪽에 있기 때문에 반드시 남서풍을 기다려야만 한다.","너는 모름지기 앉아서 노를 단단히 잡고 오직 나의 지시만을 따르도록 해라.","드디어 깃대에 깃발을 달고 자석을 뱃전에다 설치하였다.","배 안을 점검해 보니 모든 것이 다 잘 갖추어져 있었다.","돌고래가 물을 뿜고 바다 상어가 파도를 일으켰으며, 바람이 공중에서 일어나더니 깃발이 북쪽을 향해 펄럭였다.","세 사람이 힘을 다해 돛을 올리자, 배가 밤낮없이 파도를 가로지르며 질주하였다.","벽력같은 화살이 풍랑 속으로 들어가고 번개가 날듯이 순식간에 내주에 올랐다.","얼마 뒤 푸른 망망대해에 떠 있는 섬들이 나타나더니 눈을 놀리는 순간 사라져 갔다.","하루는 중국인 배를 만나게 되었는데, 그들이 물었다.","어느 지방의 배이며, 어디로 가느냐?","옥영이 응답하여 말했다.","나는 항주 사람인데 차를 사기 위해 산동으로 가는 중입니다.","또 며칠 뒤에는 일본인 배를 만나게 되었다.","옥영은 즉시 아들, 며느리와 함께 일본인 옷으로 갈아입고 기다렸다.","일본인 배가 다가와서 물었다.","너희들은 어느 지방 사람이며, 어디에서 오는 중이냐?","옥영이 일본어로 대답하였다.","고기를 잡으러 바다로 들어왔다가 풍랑을 만나 표류하게 되었습니다.","배와 노가 깨지고 부러져 항주에서 배를 사서 돌아가는 중입니다.","일본 사람이 말했다.","고생을 많이 했군요!","고생을 많이 했군요!","여기서 일본까지는 얼마 안되니 남쪽으로 가십시오.","이날 남풍이 심하게 불었다.","해가 이윽고 서쪽 바다 속으로 들어가자, 흰 이무기는 풍랑을 일으키고 푸른 파도는 하늘이 놀랄 정도로 치솟아 올랐다.","구름과 안개가 사방에 가득 끼어 지척도 분간하기 어려웠으며, 노는 부러지고 돛은 찢어져 어디로 가야 할 지 알 수가 없었다.","몽선 부부는 깜짝 놀라서 뱃바닥에 엎드리더니 이내 배멀미를 하였다.","옥영은 의연하게 홀로 앉아 하늘을 우러르며 말없이 기도하였다.","밤이 되면서 풍랑이 잦아들더니 배가 흘러서 조그만 섬에 이르렀다.","배를 수리하기 위해 며칠 머물러 있는데, 홀연히 바다 가운데서 배 한 척이 점차 다가왔다.","옥영은 몽선에게 배 안에 있는 장비를 주머니에 담아서 바위 동굴에 숨기게 하였다.","잠시 후에 뱃사람들이 시끄럽게 떠들면서 내려왔다.","말소리는 조선말이나 일본말은 아니었으며, 대략 중국말과 흡사했다.","그들은 창이나 칼 등 무기는 갖고 있지 않았으나, 흰 몽둥이로 때리고 위협하면서 화물을 내놓으라고 요구하였다.","이에 옥영이 중국말로 대답했다.","나는 중국 사람으로 고기를 잡기 위해 바다에 나왔다가 표류하여 이곳에 정박하게 된 것입니다.","그래서 본래부터 화물은 있지도 않습니다.","옥영이 눈물을 흘리면서 살아서 돌아가게 해달라고 애걸하였다.","그러자 그들은 죽이지는 않고 옥영이 타고 왔던 배를 빼앗아 자기들 배의 후미에 묶고 가버렸다.","그들이 떠난 뒤 옥영이 몽선 부부에게 말했다.","이들은 필시 해적들일 것이다.","내가 들으니 해적들의 섬이 조선과 중국의 사이에 있는데, 수시로 출몰하여 재물을 약탈하되 사람은 죽이지 않는다고 하더구나.","이들이 그 놈들임이 분명하다.","내가 아들의 말을 듣지 않고 억지로 떠났다가 하늘이 돕지 않아 이런 낭패를 당하게 되었구나.","이미 배와 노를 잃어버렸으니 다시 무엇을 할 수 있겠느냐?","어두운 하늘과 드넓은 바다를 날아서 건너갈 수도 없고 죽엽이나 마른 떼 등 몸을 실어 띄울 것도 없으니, 오로지 죽기만을 기다릴 수밖에 없구나.","나야 이미 죽은 목숨과 다름이 없기 때문에 상관이 없지만, 너희 부부가 어질지 못한 이 어미 때문에 죽게 된 것이 가련키만 하구나.","말을 마친 옥영이 아들 내외와 함께 슬프게 우니, 그 소리가 매우 처절하였다.","바닷가에 맺힌 한이 파도를 타고 겹겹이 밀려옴에 바다는 오므라들어 펴지지 않는 듯 하였으며, 산귀신은 얼굴을 찡그리고 신음하였다.","옥영이 해안으로 올라가 바다에 투신하려고 하자, 아들과 며느리가 함께 만류하여 물 속에 빠질 수가 없었다.","옥영은 몽선을 돌아보며 말했다.","너는 내가 죽는 것을 말리지 말아라.","더 이상 무엇을 기다릴 수 있겠느냐?","주머니에 남은 식량은 겨우 3일 먹을 것밖에 안 된다.","앉아서 주머니가 비기를 기다리며 살아 남은들 무엇을 할 수 있겠느냐?","몽선이 말했다.","식량이 다 떨어진 뒤에 죽더라도 늦지 않습니다.","그 사이에 만약 살 길이 생긴다면 장차 얼마나 후회할 일이겠습니까?","몽선은 마침내 어머니를 부축해 언덕에서 내려와 겨우 바위 동굴에 엎드려 쉬게 되었다.","한참 후 잠에서 깨어난 옥영이 아들과 며느리에게 말했다.","기운이 빠지고 몸이 피곤하여 문득 정신 없이 잠이 들었는데, 꿈에 장육금불께서 또 좋은 징조를 아뢰니 참 이상하구나.","세 사람은 서로 마주 보고 기뻐하면서 말없이 기도를 올렸다.","며칠 후 멀리 바다 가운데서 돛단배가 둥둥 떠오는 것이 보였다.","이에 몽선이 놀라서 말했다.","예전에 보지 못했던 배가 바다 가운데서 다가오고 있는데, 매우 걱정이 됩니다.","옥영이 머리를 들고 보더니 기뻐하며 말했다.","너는 겁내지 말아라.","우리는 이제 살았다.","저것은 조선인의 배다.","기다려 보면 당연히 알게 될 것이다.","옥영 등은 버드나무를 불태워 연기를 내고 언덕으로 올라가 옷을 흔들었다.","그리고 모두 조선의 옷으로 갈아입은 후 바위 위에 늘어서 있었다.","조선 사람들이 배를 멈추고 물었다.","당신들은 어떤 사람들인데 이런 외딴 섬에 와 있소?","옥영이 대답했다.","우리는 경성의 양반인데, 나주로 내려가다가 갑자기 풍파를 만나 배는 뒤집히고 사람들은 다 물에 빠져 죽었습니다.","오직 우리 세 사람만이 돛대 자리를 끌어안고 표류하다가 이곳에 이르렀습니다.","뱃사람들이 불쌍하게 여겨 세 사람을 태우고 귀항하면서 말했다.","이 배는 통영으로 음식물을 싣고 가는 배입니다.","관가의 일정이 정해져 있어 한양으로 돌아갈 수가 없습니다.","순천에 이르자 배를 다리에 정박시켜 놓고 세 사람을 내려 주었다.","이때가 경신년 4월이었다.","옥영 일행은 5, 6일을 걸어서 남원에 도착하였다.","옥영은 마음속으로 집이 온통 난리 중에 함몰되었을 것이기에 단지 옛 집터만을 찾아가려고 생각하였다.","감회에 젖어 두루 돌아보며 먼저 만복사를 향해 갔다.","금교 옆에 이르러 앉아서 바라보니, 성곽이 완연하였으며 시골의 집들도 예전과 다름이 없었다.","옥영은 몽선을 돌아보고 손가락으로 한 곳을 가리키며 말했다.","저기가 너의 아버지 집이었는데, 지금은 누구의 집이 되었는지 모르겠구나.","모두 가서 하룻밤 머물러 자면서 옛날 일이나 돌이켜 보자꾸나.","옥영 일행이 곧 일어나 그 집 문 앞으로 나아가 보니, 최척과 그의 아버지가 수양버들 아래 앉아 있었다.","시아버지와 며느리, 남편과 아내, 아버지와 아들, 형제가 놀라서 서로 부둥켜안고 통곡을 하였다.","진위경도 와서 자기 딸과 상봉을 하였으며, 심씨는 허둥지둥 달려나와 딸 옥영을 끌어안고 통곡하다가 기절하고 말았다.","모두들 꿈이요, 세상에 진짜로 벌어진 일이 아닌 듯이 슬픔과 기쁨을 억누르지 못하였다.","이 광경을 보기 위해 사방의 이웃들이 구름처럼 몰려들었는데, 그들은 처음에는 기괴한 놀이를 한다고 생각했다.","그러다가 지금까지 겪었던 옥영과 홍도의 이야기를 자세히 듣고는 모두들 놀라며 축하하고, 서로들 말을 전해 이 소문이 사방으로 퍼졌다.","옥영이 최척에게 말했다.","우리가 오늘 이처럼 만난 것은 실로 장육금불께서 은연중에 은혜를 베푸셨기 때문입니다.","우리가 어떻게 그 은혜에 보답하지 않을 수 있겠습니까?","이에 최척과 옥영은 두 아들과 두 며느리를 이끌고 성대하게 제물을 갖추어 만복사로 가서 성의를 다해 재를 올렸다.","이후로 최척과 옥영은 위로는 아버님과 장모님을 잘 받들고, 아래로는 자식과 며느리들을 잘 보살피며 서문 밖 옛 집에서 살았다.","진위경도 홍도에게 의탁하여 최척의 집에 함께 살면서 동고동락하였다.","남원부윤이 이 이야기를 상소로 올리자 조정에서는 최척에게 특별히 정헌대부를 가자하고, 그의 아내 옥영을 정렬부인에 봉하였다.","2년 후인 신유년에 몽석과 몽선 두 형제가 모두 무과에 급제하였다.","후에 몽석은 관직이 호남병마절도사에 이르렀으며, 몽선은 해남현감이 되었다.","이때까지 최척 부부는 모두 살아서 아들들의 영광스러운 봉양을 많이 받았으니, 참으로 희한한 일이로다!"]);

  o.type="sawtooth";o2.type="triangle";o.frequency.setValueAtTime(f*1.03,t);o.frequency.exponentialRampToValueAtTime(f,t+0.08);o2.frequency.value=f*0.5;
  if(dur>0.7){const l=ac.createOscillator(),lg=ac.createGain();l.frequency.value=4.2;lg.gain.value=f*0.02;l.connect(lg);lg.connect(o.frequency);l.start(t+0.3);l.stop(t+dur)}
  lp.type="lowpass";lp.frequency.setValueAtTime(1400,t);lp.frequency.exponentialRampToValueAtTime(320,t+dur*0.5);g2.gain.value=0.6;o2.connect(g2);g2.connect(lp);o.connect(lp);lp.connect(g);

  const n=noiseSrc(t,0.05),nf=ac.createBiquadFilter(),ng=ac.createGain();nf.type="lowpass";nf.frequency.value=500;ng.gain.setValueAtTime(vel*0.6,t);ng.gain.exponentialRampToValueAtTime(0.0008,t+0.05);n.connect(nf);nf.connect(ng);ng.connect(g);

function gPiri(f,t,dur,vel){const ac=AU.ctx;                           /* 피리·태평소: 코에 걸린 듯 쨍한 소리, 음을 밀어 올림 */

/* 가락 짓기: 한 마디짜리 가(A), 끝만 맺는 가′, 높이 올라갔다 내려오는 나(B)를 지어 가-가′-나-가′ 로 잇고, 두 번째 돌 때는 가락을 조금 꾸민다 */
function makeSong(m){
  if(!m.seed||m.seed<20){let s=m.seed*9301+49297;const rnd=()=>(s=(s*9301+49297)%233280)/233280;const J=JANG[m.jang],bars=8,notes=[];let idx=5;
    for(let b=0;b<bars;b++){let p=0;const end=b%4===3;while(p<J.n){let len=[1,2,2,3,3][Math.floor(rnd()*5)];if(end&&p>=J.n-4){len=J.n-p}if(rnd()<(m.lead==="flute"?0.35:0.18)&&!end){p+=len;continue}
      idx+=[-2,-1,-1,1,1,2,0][Math.floor(rnd()*7)];if(end&&p+len>=J.n)idx=b===bars-1?5:7;idx=Math.max(0,Math.min(10,idx));notes.push({at:b*J.n+p,len:Math.min(len,J.n-p),deg:idx,accent:p===0});p+=len}}
    return{notes,total:bars*J.n}}
  let s=m.seed*9301+49297;const rnd=()=>(s=(s*9301+49297)%233280)/233280,pickR=()=>{const a=RHY[JANG[m.jang].n];return a[Math.floor(rnd()*a.length)]};
  const n=JANG[m.jang].n,base=m.high?7:5;
  const phrase=(start,dirs,rh,endDeg)=>{const out=[];let p=0,d=start;rh.forEach((len,i)=>{if(i>0)d+=dirs[Math.floor(rnd()*dirs.length)];d=Math.max(1,Math.min(11,d));if(i===rh.length-1&&endDeg!=null)d=endDeg;
      if(!(m.rest&&i>0&&i<rh.length-1&&rnd()<m.rest))out.push({p,len,deg:d,accent:i===0});p+=len});return out};
  const rA=pickR(),rB=pickR();const A=phrase(base,[-1,1,1,2,-2,0],rA,base+2),A2=A.map(x=>({...x}));A2[A2.length-1].deg=base;
  const B=phrase(base+3,[-1,-1,-2,1,0],rB,base+1);const form=[A,A2,B,A2,A,A2,B,A2],notes=[];
  form.forEach((ph,b)=>ph.forEach((x,i)=>{let deg=x.deg;if(b>=4&&i>0&&i<ph.length-1&&rnd()<0.3)deg=Math.max(1,Math.min(11,deg+(rnd()<0.5?1:-1)));notes.push({at:b*n+x.p,len:x.len,deg,accent:x.accent,bar:b})}));
  return{notes,total:8*n};
}
function auPlay(kind,f,t,dur,vel){
  if(kind==="flute")gFlute(f,t,dur*1.05,vel*0.16);else if(kind==="haegeum")gHaegeum(f,t,Math.max(0.18,dur*0.98),vel*0.11);else if(kind==="geomungo")gGeomungo(f*0.5,t,Math.max(0.7,dur*1.5),vel*0.42);
  else if(kind==="piri")gPiri(f,t,Math.max(0.12,dur*0.92),vel*0.075);else if(kind==="bell")gBell(f,t,dur,vel*0.2);else gPluck(f,t,Math.max(0.5,dur*1.4),vel*0.3)}
function auTick(){
  const ac=AU.ctx,m=MOODS[AU.mood];if(!ac||!m||!AU.song)return;
  const J=JANG[m.jang],dv=m.drum==null?1:m.drum;
  while(AU.next<ac.currentTime+0.25){
    const i=AU.step%AU.song.total,t=AU.next,pos=i%J.n,h=J.hits[pos],bar=Math.floor(i/J.n);
    if(h&&dv){if(h==="기덕"){gDrum("기",t,0.28*dv);gDrum("덕",t+m.eighth*0.5,0.3*dv)}else gDrum(h,t,(h==="덩"||h==="쿵"?0.55:0.32)*dv)}
    if(m.kk&&J.kk&&J.kk.includes(pos))gKkwaeng(t,0.05);else if(m.kk&&!J.kk&&pos%2===0)gKkwaeng(t,pos===0?0.06:0.035);
    if(m.drone&&pos===0)gDrone(m.base*0.5,t,J.n*m.eighth*1.02,0.09);
    for(const nt of AU.song.notes)if(nt.at===i){const f=degFreq(m,nt.deg)*2,dur=nt.len*m.eighth;auPlay(m.lead,f,t,dur,nt.accent?1.15:1);
      if(m.second&&bar>=2&&(nt.accent||bar>=6))auPlay(m.second,f*(m.second==="bell"?1:0.5),t,dur,0.7)}
    AU.next+=m.eighth;AU.step++}
}

const FX=[];
async function flog(target,n,opt){
  opt=opt||{};
  const hit=G.map.npcs.find(x=>(x.look==="sar"||x.look==="guard")&&x!==target&&visible(x));let back=null;
  if(hit){back=[hit.tx,hit.ty,hit.dir];G.flash=0;setNear(hit,[[target.tx-1,target.ty],[target.tx+1,target.ty],[target.tx-1,target.ty+1],[target.tx+1,target.ty+1]]);hit.dir=hit.tx<target.tx?"r":"l";hit.fixed=1;await sleep(250)}
  for(let i=0;i<n;i++){
    const t0=performance.now()/1000;FX.push({k:"paddle",e:target,t0,dur:0.42,count:(opt.from||0)+i+1,tool:opt.tool});
    await sleep(210);sfx(opt.sfx||"whack");G.shake=Math.max(G.shake||0,opt.hard?5:3.5);target.hurt=0.35;
    FX.push({k:"hit",e:target,t0:performance.now()/1000,dur:0.5,count:(opt.from||0)+i+1});
    await sleep(opt.fast?260:380);
  }
  if(hit&&back){await sleep(200);hit.tx=back[0];hit.ty=back[1];hit.dir=back[2]}
}
function drawFX(t){
  const cx=G.cam.x,cy=G.cam.y;
  for(let i=FX.length-1;i>=0;i--){const f=FX[i],p=(t-f.t0)/f.dur;if(p>1.2){FX.splice(i,1);continue}if(p<0)continue;
    const [px,py]=entPos(f.e),sx=Math.round(px-cx),sy=Math.round(py-cy);
    if(f.k==="fly"){const [qx,qy]=entPos(f.to),q=Math.min(1,p);if(p<1.02)drawHeldIcon(f.id,sx+8+(qx-px)*q,sy-2+(qy-py)*q-Math.sin(Math.PI*q)*18,t);continue}
    if(f.k==="paddle"&&f.tool){const a=0.5-Math.min(1,p*1.9)*2.0;ctx.save();ctx.translate(sx+25,sy+3);ctx.rotate(a);ctx.scale(1.5,1.5);drawHeldIcon(f.tool,0,0,t);ctx.restore()}
    else if(f.k==="paddle"){const a=-1.7+Math.min(1,p*1.9)*2.3;ctx.save();ctx.translate(sx+26,sy-30);ctx.rotate(a);
      ctx.fillStyle="#1d1813";ctx.fillRect(-4,-1,8,40);ctx.fillStyle="#6d4b2c";ctx.fillRect(-2,0,4,14);ctx.fillStyle="#a07a4c";ctx.fillRect(-3,14,6,24);ctx.fillStyle="#c49a64";ctx.fillRect(-2,15,1,22);ctx.restore()}
    if(f.k==="hit"&&p<1){const r=4+p*10,al=1-p;ctx.globalAlpha=al;ctx.fillStyle="#fff6c8";
      for(let k=0;k<8;k++){const an=k*Math.PI/4+0.3;ctx.fillRect(Math.round(sx+8+Math.cos(an)*r)-1,Math.round(sy-2+Math.sin(an)*r)-1,2,2)}
      ctx.fillStyle="#e0493a";ctx.fillRect(sx+6,sy-4,4,4);ctx.globalAlpha=1}
  }
}

const TOKENS={

  const c=document.querySelector(".itemget canvas.itimg");if(c){if(pic){const g=c.getContext("2d"),s=Math.min(220/pic.width,180/pic.height),w=pic.width*s,h=pic.height*s;g.imageSmoothingQuality="high";g.drawImage(pic,(240-w)/2,(200-h)/2,w,h)}else c.remove()}

/* 알아보기: 모은 증표 가운데 이 대목의 실마리를 고른다. 아직 못 얻은 증표도 이름은 보인다(외워서 푸는 문제가 아니라, 앞에서 본 것을 견주는 문제) */
function tokenMatch(q,ans,hint){return new Promise(res=>{const E=G.ex;E.tokens=E.tokens||[];let msg="";
  const v=gmOpen("");const box=v.querySelector(".sheet");
  const paint=()=>{box.innerHTML=`<span class="eb">증표로 알아보기</span><h2>${esc(q)}</h2><p class="note">앞에서 얻은 증표 가운데 실마리가 되는 것을 고르세요. 기록첩에서 앞의 문장을 다시 볼 수 있어요.</p>
    <div class="dress">${Object.entries(TOKENS).map(([id,t])=>`<button data-k="${id}"${id===ans?' data-hot="1"':""}><b style="display:block;font-family:var(--display);font-weight:400;font-size:17px">${esc(t.n)}</b><span style="font-size:12.5px;color:var(--muted)">${E.tokens.includes(id)?esc(t.d.slice(0,46))+(t.d.length>46?"…":""):"(아직 얻지 못한 증표)"}</span></button>`).join("")}</div>
    <div class="st">${msg||"&nbsp;"}</div><div class="row"><button class="btn" data-rec>기록첩 보기</button></div>`};
  paint();v.dataset.hot="";
  box.addEventListener("click",e=>{if(e.target.closest("[data-rec]")){const prev=UI.onKey;$("#bRec").click();return}
    const b=e.target.closest("[data-k]");if(!b)return;if(b.dataset.k===ans){sfx("correct");addXp(10);gmClose(v);res()}else{sfx("wrong");shk(box);miss(q);msg=hint;paint()}});
  UI.onKey=()=>true})}

function drawHeld(e,sx,sy,topY,t){

          ctx.strokeStyle="rgba(255,255,255,"+(0.85*(1-q))+")";ctx.lineWidth=2.5;ctx.beginPath();ctx.arc(hx,hy,22,a0-Math.PI/2,ang-Math.PI/2,s<0);ctx.stroke();

function glossOf(t){if(!t||typeof t!=="string")return "";G.ex.words=G.ex.words||[];const seen=new Set(G.ex.words);const found=[];let rest=t;
  for(const k of GKEYS)if(rest.includes(k)){if(k==="감사"&&!/감사(?![하히합드])/.test(rest)){rest=rest.split(k).join(" ");continue}const lb=GL(k);if(!found.some(f=>GL(f)===lb))found.push(k);rest=rest.split(k).join(" ")}
  if(!found.length)return "";found.sort((a,b)=>(seen.has(a)?1:0)-(seen.has(b)?1:0)||t.indexOf(a)-t.indexOf(b));
  const show=found.slice(0,4);let add=false;for(const k of show)if(!seen.has(k)){G.ex.words.push(k);add=true}if(add){writeSave();const nb=$("#nEvid");if(nb)nb.textContent=G.ex.words.length}
  return show.map(k=>GL(k)+": "+GM(k)).join("  ·  ")}
function GL(k){const v=GLOSS[k]||"";return v.includes("|")?v.split("|")[0]:k}
function GM(k){const v=GLOSS[k]||"";return v.includes("|")?v.split("|")[1]:v}
